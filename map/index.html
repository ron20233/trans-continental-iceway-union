<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090b0f">
<title>Transit Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#090b0f; --glass:rgba(16,19,26,.74); --glass-b:rgba(255,255,255,.09);
  --text:#f2f5fa; --muted:#8d97a9; --line:rgba(255,255,255,.1);
  --accent:#19a7ff; --accent-soft:rgba(25,167,255,.16);
  --xg:linear-gradient(135deg,#17b83b,#a4f20f); --ps:linear-gradient(135deg,#0a62f0,#19c1ff);
  --shadow:0 18px 50px rgba(0,0,0,.55);
  --ease:cubic-bezier(.2,.9,.25,1); --spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
  font-family:Inter,"Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;overflow:hidden}
h1,h2,h3,.ptitle,.thead{font-family:"Space Grotesk",Inter,"Segoe UI",system-ui,sans-serif;letter-spacing:-.01em}
button{font:inherit;color:inherit}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(1.5);backdrop-filter:blur(26px) saturate(1.5);
  border:1px solid var(--glass-b);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.07)}

.reveal{position:relative}
.reveal::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .25s;
  background:radial-gradient(170px circle at var(--mx,-999px) var(--my,-999px),rgba(255,255,255,.14),transparent 70%)}
.reveal::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;opacity:0;transition:opacity .25s;
  background:radial-gradient(120px circle at var(--mx,-999px) var(--my,-999px),rgba(255,255,255,.75),transparent 65%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.reveal:hover::before,.reveal:hover::after{opacity:1}

.fx{transition:transform .35s var(--spring),box-shadow .35s,background .25s,opacity .25s;outline:none}
.fx:hover{transform:scale(1.04)}
.fx:active{transform:scale(.96)}
.fx:focus-visible{transform:scale(1.06);box-shadow:0 0 0 2px #fff,0 0 0 6px rgba(255,255,255,.14),0 0 34px rgba(25,167,255,.55)}

#view{position:fixed;inset:0;touch-action:none;cursor:grab;overflow:hidden;
  background:radial-gradient(1200px 700px at 50% 0%,#141a26,#090b0f)}
#view.drag{cursor:grabbing}
body.picking #view{cursor:crosshair}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#stage canvas{display:block;background:#fff;box-shadow:0 10px 60px rgba(0,0,0,.6);transition:filter .9s var(--ease)}
#stage.dim canvas{filter:brightness(.42) saturate(.7) contrast(1.05)}

.pin{position:absolute;width:0;height:0;pointer-events:none}
.pin .sc{position:absolute;left:0;top:0;width:0;height:0;transform:scale(var(--inv,1));transform-origin:0 0}
.pin .an{position:absolute}
.pin.s i{position:absolute;left:0;top:0;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;
  background:var(--accent);border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4);transform:scale(var(--inv,1))}
.pin.s b{position:absolute;left:0;top:0;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;
  border:2px solid var(--accent);opacity:0;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(calc(var(--inv,1)*1));opacity:.9}100%{transform:scale(calc(var(--inv,1)*4));opacity:0}}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes ring{from{transform:scale(.4);opacity:1}to{transform:scale(5);opacity:0}}
@keyframes breathe{from{transform:scale(1)}to{transform:scale(1.18)}}
.rp .pa{animation:pop .55s var(--spring) both;animation-delay:var(--d,0s)}
.rs .an{width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#fff;border:3px solid var(--c);
  box-shadow:0 0 0 2px rgba(0,0,0,.35),0 0 14px var(--c)}
.rs.big .an{width:18px;height:18px;margin:-9px 0 0 -9px;border-width:4px}
.badge{left:-16px;top:-50px;width:32px;height:44px}
.badge .dot{position:absolute;left:0;top:0;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
  font-weight:800;font-size:15px;color:#fff;background:var(--g);box-shadow:0 6px 18px rgba(0,0,0,.5),0 0 22px var(--gc)}
.badge::after{content:"";position:absolute;left:11px;top:24px;width:10px;height:10px;background:var(--g);transform:rotate(45deg)}
.lbl{left:22px;top:-44px;white-space:nowrap;max-width:min(240px,62vw);overflow:hidden;text-overflow:ellipsis;background:rgba(10,12,17,.9);border:1px solid rgba(255,255,255,.16);
  padding:5px 11px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.lbl.t{left:14px;top:-26px;font-weight:500;font-size:12px;padding:3px 9px}
.ping .an{width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;border:3px solid var(--c);animation:ring 1.1s ease-out forwards}
.veh .an{width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:#fff;
  box-shadow:0 0 0 5px var(--c),0 0 26px 8px var(--c),0 0 60px 14px rgba(255,255,255,.3);animation:breathe .8s ease-in-out infinite alternate}

.rsvg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.rsvg path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.rsvg .g3{stroke:var(--c);opacity:.12;stroke-width:calc(40px*var(--inv,1))}
.rsvg .g2{stroke:var(--c);opacity:.2;stroke-width:calc(28px*var(--inv,1))}
.rsvg .g1{stroke:var(--c);opacity:.38;stroke-width:calc(18px*var(--inv,1))}
.rsvg .case{stroke:#fff;stroke-width:calc(10px*var(--inv,1))}
.rsvg .core{stroke:var(--c);stroke-width:calc(6px*var(--inv,1))}
.rsvg .flow{stroke:#fff;opacity:.95;stroke-width:calc(2.4px*var(--inv,1));
  stroke-dasharray:calc(3px*var(--inv,1)) calc(24px*var(--inv,1));animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:calc(-27px*var(--inv,1))}}
.rsvg .walk .core{stroke:#fff;stroke-dasharray:calc(2px*var(--inv,1)) calc(10px*var(--inv,1))}
.rsvg .walk .case,.rsvg .walk .g1,.rsvg .walk .g2,.rsvg .walk .g3{display:none}
.rsvg .trail{stroke:#fff;stroke-width:calc(5px*var(--inv,1));opacity:.9}

.top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px 0;
  display:flex;justify-content:center;pointer-events:none;z-index:5;transition:opacity .4s var(--ease),transform .5s var(--ease)}
body.journey .top{opacity:0;transform:translateY(-24px)}
body.journey .search{pointer-events:none!important}
.search{width:min(580px,100%);pointer-events:auto}
.bar{display:flex;align-items:center;gap:8px;border-radius:18px;padding:0 8px 0 16px;height:54px;transition:box-shadow .3s,border-color .3s}
.bar.demo{border-color:rgba(25,167,255,.9);box-shadow:0 0 0 3px rgba(25,167,255,.22),0 0 30px rgba(25,167,255,.28)}
.bar>svg{flex:none;color:var(--muted)}
.bar input{flex:1;min-width:0;border:0;background:transparent;outline:0;color:var(--text);font:inherit;font-size:16px;height:100%}
.bar input::placeholder{color:var(--muted)}
.go{border:0;background:var(--ps);color:#fff;border-radius:12px;height:38px;padding:0 16px;font-size:14px;font-weight:700;cursor:pointer}
.go:disabled{opacity:.6;cursor:default}
.ib{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);cursor:pointer;
  display:grid;place-items:center;flex:none;padding:0}
.ib svg{display:block}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:rot .7s linear infinite;display:none}
.busy>.spin{display:block}
@keyframes rot{to{transform:rotate(360deg)}}
.results{margin-top:8px;border-radius:18px;overflow:hidden auto;max-height:min(50vh,360px);display:none}
.results.show{display:block;animation:rise .4s var(--ease) both}
.res{display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;border-bottom:1px solid var(--line)}
.res:last-child{border-bottom:0}
.res:hover,.res.on{background:var(--accent-soft)}
.chip{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);flex:none}
.res span.l{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.res small{color:var(--muted);flex:none}
.note{padding:12px 16px;color:var(--muted);font-size:14px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.ctrl{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:5;display:flex;flex-direction:column;gap:8px}
.ctrl button{width:46px;height:46px;border-radius:14px;cursor:pointer;display:grid;place-items:center;font-size:21px;padding:0}
#helpBtn{font-weight:800;font-size:19px;color:var(--accent)}
.pager{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:5;
  display:none;align-items:center;gap:4px;border-radius:14px;padding:4px}
.pager.show{display:flex}
.pager button{width:36px;height:36px;border:0;background:transparent;font-size:18px;border-radius:10px;cursor:pointer}
.pager button:disabled{opacity:.3}
.pager span{padding:0 8px;font-size:14px;color:var(--muted);min-width:64px;text-align:center}
body.journey .pager{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 14px)}
@media (max-width:899px){body.journey .ctrl{display:none}}

.empty{position:fixed;inset:0;display:none;place-items:center;text-align:center;color:var(--muted);padding:24px;z-index:1}
.empty.show{display:grid}
.empty h2{margin:0 0 6px;color:var(--text);font-size:20px;font-weight:600}
.empty p{margin:0;font-size:14px}
.loader{position:fixed;inset:0;display:none;place-items:center;z-index:2;color:var(--muted);font-size:14px}
.loader.show{display:grid}

.panel{position:fixed;z-index:8;left:16px;top:16px;bottom:16px;width:392px;border-radius:24px;display:flex;flex-direction:column;
  opacity:0;transform:translateX(-30px) scale(.96);filter:blur(10px);pointer-events:none;
  transition:opacity .5s var(--ease),transform .6s var(--spring),filter .5s var(--ease)}
.panel[hidden]{display:none}
.panel.in{opacity:1;transform:none;filter:none;pointer-events:auto}
.amb{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none;z-index:0}
.amb::before{content:"";position:absolute;inset:-40%;
  background:radial-gradient(38% 38% at 18% 18%,rgba(25,167,255,.28),transparent 62%),
             radial-gradient(34% 34% at 82% 72%,rgba(164,242,15,.16),transparent 62%),
             radial-gradient(30% 30% at 70% 10%,rgba(150,90,255,.16),transparent 62%);
  animation:drift 16s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(8%,6%) rotate(14deg) scale(1.12)}}
.panel>*:not(.amb){position:relative;z-index:1}
.phead{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 8px}
.ptitle{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:.01em}
.logo{width:26px;height:26px;border-radius:9px;background:var(--xg);display:grid;place-items:center;box-shadow:0 0 22px rgba(164,242,15,.45)}
.grab{display:none}
.fields{position:relative;display:flex;gap:10px;align-items:stretch;padding:8px 18px 4px}
.rail{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;width:16px;flex:none;padding:6px 0}
.rail i{width:12px;height:12px;border-radius:50%}
.rail i.a{background:#a4f20f;box-shadow:0 0 12px #a4f20f}
.rail i.b{background:var(--accent);box-shadow:0 0 12px var(--accent)}
.rail span{flex:1;width:2px;background:repeating-linear-gradient(#fff6 0 3px,transparent 3px 8px);min-height:20px}
.inputs{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.field{position:relative;display:flex;align-items:center;height:48px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid var(--line);
  transition:box-shadow .3s,border-color .3s,background .3s}
.field:focus-within,.field.demo{border-color:rgba(25,167,255,.9);background:rgba(255,255,255,.1);box-shadow:0 0 0 3px rgba(25,167,255,.22),0 0 30px rgba(25,167,255,.28)}
.field.picking{border-color:#a4f20f;box-shadow:0 0 0 3px rgba(164,242,15,.22),0 0 30px rgba(164,242,15,.3);animation:glowp 1.2s ease-in-out infinite alternate}
@keyframes glowp{to{box-shadow:0 0 0 6px rgba(164,242,15,.1),0 0 40px rgba(164,242,15,.5)}}
.field.err{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.field input{flex:1;min-width:0;height:100%;background:transparent;border:0;outline:0;color:var(--text);font:inherit;font-size:15px;padding:0 6px 0 14px}
.field input::placeholder{color:var(--muted)}
.clr{display:none;flex:none;width:26px;height:26px;margin-right:2px;border-radius:50%;border:0;padding:0;background:rgba(255,255,255,.12);color:var(--muted);cursor:pointer;place-items:center;font-size:17px;line-height:1}
.clr:hover{color:#fff;background:rgba(255,255,255,.2)}
.field.has .clr{display:grid}
.pick{width:36px;height:36px;margin-right:6px;border-radius:10px;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--muted);padding:0}
.pick:hover,.field.picking .pick{color:#a4f20f}
.swap{align-self:center;flex:none}
.swap.spin1 svg{animation:flip .55s var(--spring)}
@keyframes flip{from{transform:rotate(0)}to{transform:rotate(180deg)}}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;border-radius:14px;overflow-x:hidden;overflow-y:auto;max-height:min(300px,38dvh);overscroll-behavior:contain;scrollbar-width:thin;display:none;
  background:rgba(20,24,32,.97);border:1px solid var(--glass-b);box-shadow:var(--shadow)}
.sugg.show{display:block;animation:rise .25s var(--ease) both}
.sg{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;font-size:14.5px}
.sg:hover,.sg.on{background:rgba(255,255,255,.09)}
.sg span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sg span mark{background:none;color:var(--accent);font-weight:700}
.sg em{flex:none}
.sg em{display:flex;gap:3px}
.sg em u{width:8px;height:8px;border-radius:50%;display:block}
.cta{position:relative;overflow:hidden;margin:12px 18px 6px;height:50px;border:0;border-radius:14px;background:var(--xg);color:#06210a;
  font-weight:800;font-size:16px;letter-spacing:.02em;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;
  box-shadow:0 10px 30px rgba(80,200,40,.35)}
.cta::after{content:"";position:absolute;top:0;bottom:0;width:60%;left:-80%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);
  transform:skewX(-20deg);animation:sheen 3.2s ease-in-out infinite}
@keyframes sheen{0%,60%{left:-80%}100%{left:140%}}
.cta.busy{pointer-events:none;filter:saturate(.7)}
.cta.busy span{opacity:.7}
.pbody{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:10px 18px 20px;scrollbar-width:thin;scrollbar-color:#fff3 transparent}
.hint{color:var(--muted);font-size:14px;line-height:1.5;animation:rise .5s var(--ease) both}
.chips{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.chipb{padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-size:13px;color:var(--text)}
.chipb b{font-size:15px;margin-right:4px}
.center{display:grid;place-items:center;text-align:center;gap:14px;padding:34px 10px;color:var(--muted);font-size:14px;animation:rise .4s var(--ease) both}
.orbit{position:relative;width:46px;height:46px}
.orbit i{position:absolute;inset:0;animation:orb 2.2s cubic-bezier(.2,.6,.4,1) infinite;opacity:0}
.orbit i::after{content:"";position:absolute;left:50%;top:0;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:#fff;box-shadow:0 0 10px #fff}
.orbit i:nth-child(2){animation-delay:.14s}.orbit i:nth-child(3){animation-delay:.28s}.orbit i:nth-child(4){animation-delay:.42s}.orbit i:nth-child(5){animation-delay:.56s}
@keyframes orb{0%{transform:rotate(0);opacity:1}70%{transform:rotate(300deg);opacity:1}100%{transform:rotate(360deg);opacity:0}}
.errm{color:#ff8c8c}
.rsum{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;margin:0 0 12px;font-size:14px;color:var(--muted);animation:rise .5s var(--ease) both}
.rsum b{min-width:0;max-width:100%;color:var(--text);font-weight:650;overflow-wrap:anywhere}
.rsum i{font-style:normal;color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border-radius:16px;padding:12px 8px;text-align:center;background:rgba(255,255,255,.07);border:1px solid var(--line);animation:rise .6s var(--ease) both}
.stat:nth-child(2){animation-delay:.08s}.stat:nth-child(3){animation-delay:.16s}
.stat b{display:block;font-size:28px;font-weight:800;line-height:1.1;background:var(--ps);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat small{color:var(--muted);font-size:12px}
.ride{width:100%;margin:12px 0 4px;height:46px;border-radius:14px;border:1px solid rgba(25,167,255,.5);background:rgba(25,167,255,.14);cursor:pointer;
  font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;animation:rise .6s var(--ease) .2s both}
.ride.on{background:var(--ps);border-color:transparent}
.tl{margin-top:10px;position:relative}
.row{display:flex;gap:12px;position:relative;padding-bottom:6px;animation:rise .6s var(--ease) both;animation-delay:calc(var(--i,0)*70ms + 250ms)}
.row .rl{display:flex;flex-direction:column;align-items:center;width:30px;flex:none}
.row .rl .pt{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;flex:none}
.row .rl .pt.a{background:var(--xg);color:#06210a;box-shadow:0 0 18px rgba(164,242,15,.5)}
.row .rl .pt.b{background:var(--ps);box-shadow:0 0 18px rgba(25,167,255,.5)}
.row .rl .ln{flex:1;width:6px;border-radius:3px;background:var(--c);margin:4px 0;transform-origin:top;animation:grow .8s var(--ease) both;
  animation-delay:calc(var(--i,0)*70ms + 400ms);box-shadow:0 0 12px var(--c);min-height:18px}
.row .rl .ln.walk{background:repeating-linear-gradient(#fff 0 3px,transparent 3px 8px);box-shadow:none;width:3px}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.row .rc{flex:1;min-width:0;padding-bottom:12px;overflow-wrap:anywhere}
.rc .nm{font-weight:650;font-size:15px;cursor:pointer;display:inline-block;max-width:100%;border-radius:6px;overflow-wrap:anywhere;line-height:1.3}
.rc .nm:hover{color:#fff;text-shadow:0 0 14px rgba(255,255,255,.6)}
.rc small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.lchip{max-width:100%;flex-wrap:wrap;row-gap:0;display:inline-flex;align-items:center;gap:8px;margin:2px 0 6px;padding:4px 12px;border-radius:999px;font-weight:800;font-size:13px;background:var(--c);
  box-shadow:0 0 20px -2px var(--c)}
.lchip i{font-style:normal;font-weight:500;opacity:.85}
.more{background:none;border:0;color:var(--accent);cursor:pointer;font-size:13px;padding:2px 0;margin:2px 0 4px}
.mid{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--ease)}
.mid.open{grid-template-rows:1fr}
.mid ul{overflow:hidden;margin:0;padding:0;list-style:none}
.mid li{overflow-wrap:anywhere;padding:5px 0 5px 12px;font-size:13.5px;color:#cdd3de;border-left:2px solid var(--c);cursor:pointer;margin-left:2px;transition:color .3s,background .3s}
.mid li:hover{color:#fff}
.row.pass .nm,.mid li.pass{color:#fff}
.mid li.act,.row.act .nm{color:#fff;text-shadow:0 0 14px var(--accent)}
.mid li.act{background:linear-gradient(90deg,rgba(25,167,255,.22),transparent)}

function analyze(ol, base, W, H, texts){

  function paint(stroke,fill,close){

    const sc=Math.sqrt(Math.abs(M[0]*M[3]-M[1]*M[2]))||1;

    for(const sp of path){

      let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
      for(const p of pts){if(p[0]<x0)x0=p[0];if(p[0]>x1)x1=p[0];if(p[1]<y0)y0=p[1];if(p[1]>y1)y1=p[1];}
      const w=x1-x0,h=y1-y0,size=Math.max(w,h);

      case OPS.restore: if(stack.length) st=stack.pop();break;
      case OPS.transform: st=Object.assign({},st,{ctm:mmul(a,st.ctm)});break;
      case OPS.paintFormXObjectBegin: stack.push(st);if(a&&a[0]) st=Object.assign({},st,{ctm:mmul(a[0],st.ctm)});break;
      case OPS.paintFormXObjectEnd: if(stack.length) st=stack.pop();break;
      case OPS.setLineWidth: st=Object.assign({},st,{lw:a[0]});break;
      case OPS.setGState:

  }
  if(stops0.length<2) return {error:'no-stops'};
  const sizes=stops0.map(s=>s.size).sort((a,b)=>a-b);
  const msz=sizes[sizes.length>>1];
  const stops1=stops0.filter(s=>s.size>=msz*0.3&&s.size<=msz*4);

  const colIdx=new Map(),V=[],E=[],snap=1.5,vh=new Map();
  function gv(ci,x,y){
    const gx=Math.floor(x/snap),gy=Math.floor(y/snap);
    for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){
      const l=vh.get(ci+'|'+(gx+dx)+'|'+(gy+dy));if(!l)continue;

    }

  }

    const A=V[E[id].a],B=V[E[id].b];
    const ax=Math.floor(Math.min(A.x,B.x)/EC),bx=Math.floor(Math.max(A.x,B.x)/EC);
    const ay=Math.floor(Math.min(A.y,B.y)/EC),by=Math.floor(Math.max(A.y,B.y)/EC);
    for(let x=ax;x<=bx;x++)for(let y=ay;y<=by;y++){const k=x+','+y;let l=eg.get(k);if(!l){l=[];eg.set(k,l);}l.push(id);}
  }

  const colStops=new Map();
  for(const s of stops1){
    const tol=s.size*0.8+2.5,best=new Map(),seen=new Set();

      }
    }
    s.best=best;
    for(const c of best.keys()){let z=colStops.get(c);if(!z){z=new Set();colStops.set(c,z);}z.add(s);}

  for(const s of stops1){

  const cand=[];
  for(const t of texts){ if(t.str.length<3||!/\p{L}/u.test(t.str)) continue; cand.push(t); }

    const n=Math.floor(e.l/(msz*0.8));

  for(const t of texts){
    if(t.str.length>4||!/[\p{L}\p{N}]/u.test(t.str)) continue;
    const mx=(t.minX+t.maxX)/2,my=(t.minY+t.maxY)/2;let bd=R,bc=0;
    for(let x=Math.floor((mx-R)/48);x<=Math.floor((mx+R)/48);x++)for(let y=Math.floor((my-R)/48);y<=Math.floor((my+R)/48);y++){
      const l=vg.get(x+','+y);if(!l)continue;
      for(const id of l){const v=vsamp[id],d=Math.hypot(v.x-mx,v.y-my);if(d<bd){bd=d;bc=v.c;}}
    }
    if(bc){const m=cnt[bc-1];m.set(t.str,(m.get(t.str)||0)+1);}
  }
  colors.forEach((c,i)=>{
    let best=null,bn=1;for(const [k,n] of cnt[i]) if(n>bn){best=k;bn=n;}
    c.name=best||('Line '+(i+1));
  });

  const EL=[];
  for(const e of E){
    if(e.dead)continue;const c=qIdx.get(e.c);if(!c)continue;
    EL.push([e.a,e.b,c,e.l]);
  }
  return finishGraph(V.map(v=>({x:v.x,y:v.y,stop:v.stop})),stops,colors,K,EL,msz,W,H);
}

function finishGraph(V,stops,colors,K,EL,msz,W,H){
  const adj=Array.from({length:V.length},()=>[]);
  for(const e of EL){adj[e[0]].push({to:e[1],c:e[2],w:e[3]});adj[e[1]].push({to:e[0],c:e[2],w:e[3]});}
  for(const s of stops){
    for(let i=0;i<s.v.length;i++)for(let j=i+1;j<s.v.length;j++){
      const a=s.v[i],b=s.v[j],d=Math.hypot(V[a].x-V[b].x,V[a].y-V[b].y);
      adj[a].push({to:b,c:0,w:d});adj[b].push({to:a,c:0,w:d});
    }
  }
  for(let i=0;i<stops.length;i++)for(let j=i+1;j<stops.length;j++){
    const A=stops[i],B=stops[j],d=Math.hypot(A.x-B.x,A.y-B.y);
    if(d<=msz*1.8){const a=A.v[0],b=B.v[0];adj[a].push({to:b,c:K+1,w:d*3});adj[b].push({to:a,c:K+1,w:d*3});}
  }
  return {V,stops,colors,K,adj,msz,PEN:msz*10,W,H,EL};
}

const rnd=n=>Math.round(n*10)/10;
function packGraph(g){
  return {W:g.W,H:g.H,K:g.K,msz:rnd(g.msz),colors:g.colors,
    V:g.V.map(v=>[rnd(v.x),rnd(v.y),v.stop]),
    S:g.stops.map(t=>[rnd(t.x),rnd(t.y),rnd(t.size),t.name,t.v,t.colors||[]]),
    E:g.EL.map(e=>[e[0],e[1],e[2],rnd(e[3])])};
}
function unpackGraph(p){
  const V=p.V.map(a=>({x:a[0],y:a[1],stop:a[2]}));
  const stops=p.S.map((a,i)=>({idx:i,x:a[0],y:a[1],size:a[2],name:a[3],v:a[4],colors:a[5]||[]}));
  return finishGraph(V,stops,p.colors,p.K,p.E,p.msz,p.W,p.H);
}
async function zipStr(str){
  if(typeof CompressionStream==='undefined')return 'p:'+str;
  const bytes=new Uint8Array(await new Response(new Blob([str]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());
  let bin='';for(let i=0;i<bytes.length;i+=32768)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+32768));
  return 'g:'+btoa(bin);
}
async function unzipStr(t){
  if(t.startsWith('p:'))return t.slice(2);
  const bin=atob(t.slice(2)),bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
}

async function fbGet(path){

function computeRoute(g,src,dst){
  const {V,stops,adj,K,PEN}=g,K1=K+2,N=V.length;
  const dist=new Float64Array(N*K1).fill(Infinity),prev=new Int32Array(N*K1).fill(-1),pc=new Int8Array(N*K1);
  const isDst=new Uint8Array(N);for(const v of stops[dst].v)isDst[v]=1;
  const hp=new MinHeap();
  for(const v of stops[src].v){dist[v*K1]=0;hp.push(0,v*K1);}
  let found=-1;
  while(hp.size){
    const [d,s]=hp.pop();if(d>dist[s])continue;
    const v=(s/K1)|0,last=s%K1;
    if(isDst[v]){found=s;break;}
    for(const e of adj[v]){
      let nd=d+e.w,nl=last;
      if(e.c!==0){if(last!==0&&last!==e.c)nd+=PEN;nl=e.c;}
      const ns=e.to*K1+nl;
      if(nd<dist[ns]){dist[ns]=nd;prev[ns]=s;pc[ns]=e.c;hp.push(nd,ns);}
    }
  }
  if(found<0) return null;
  const seq=[],cols=[];
  for(let s=found;s>=0;s=prev[s]){seq.push((s/K1)|0);cols.push(prev[s]>=0?pc[s]:-1);}
  seq.reverse();cols.reverse();
  const pts=seq.map(v=>[V[v].x,V[v].y]);
  const cum=new Float64Array(pts.length);
  for(let i=1;i<pts.length;i++)cum[i]=cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
  const legs=[];let cur=null;
  for(let i=1;i<seq.length;i++){
    const c=cols[i];
    if(c===0){if(cur)cur.b=i;continue;}
    if(!cur||cur.c!==c){cur={c,a:i-1,b:i};legs.push(cur);}else cur.b=i;
  }

  legs[0].a=0;legs[legs.length-1].b=seq.length-1;
  for(let k=0;k<legs.length-1;k++)legs[k].b=legs[k+1].a;
  const events=[];
  for(const L of legs){
    L.stops=[];L.walk=L.c===K+1;
    L.color=L.walk?'#ffffff':g.colors[L.c-1].hex;L.name=L.walk?'Walk':g.colors[L.c-1].name;
    for(let i=L.a;i<=L.b;i++){
      const si=V[seq[i]].stop;if(si<0)continue;
      if(L.stops.length&&L.stops[L.stops.length-1].stop===si)continue;
      L.stops.push({stop:si,i,dist:cum[i]});
    }
  }
  for(const L of legs)for(const e of L.stops){if(!events.length||events[events.length-1].stop!==e.stop)events.push(e);}
  if(events.length&&events[0].stop!==src)events.unshift({stop:src,i:0,dist:0});
  if(events.length&&events[events.length-1].stop!==dst)events.push({stop:dst,i:pts.length-1,dist:cum[pts.length-1]});
  const hops=Math.max(1,events.length-1),transfers=Math.max(0,legs.length-1);

}

function extractText(){
  extracted=(async()=>{
    const raw=[];
    for(let n=1;n<=pdf.numPages;n++){
      const page=await pdf.getPage(n),tc=await page.getTextContent();
      for(const it of tc.items){
        const str=(it.str||'').replace(/\s+/g,' ').trim();if(!str)continue;
        raw.push({page:n,str,x0:it.transform[4],y0:it.transform[5],w:it.width||0,h:it.height||Math.abs(it.transform[3])||1});
      }
    }
    const merged=[];
    for(const t of raw){
      const p=merged[merged.length-1],h=p?Math.max(p.h,t.h):0;
      if(p&&p.page===t.page&&Math.abs(p.y0-t.y0)<h*0.25&&t.x0-(p.x0+p.w)>=-1&&t.x0-(p.x0+p.w)<h*0.6){p.str+=' '+t.str;p.w=t.x0+t.w-p.x0;}
      else merged.push(Object.assign({},t));
    }
    items=merged.map((t,i)=>Object.assign(t,{id:i,x:t.x0+t.w/2,y:t.y0+t.h/2}));
    return items;
  })();
  return extracted;
}

async function geminiJSON(prompt){

    body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:0,responseMimeType:'application/json',thinkingConfig:{thinkingBudget:0}}})
  });
  if(!r.ok)throw new Error('api '+r.status);

}
async function aiSearch(query){

  if(payload.length>400000)throw new Error('too large');
  const out=await geminiJSON(
`You help users search a transit map. Below is every text label found on the map, one per line, formatted as id|page|text.
The user searches for a transit line and/or a stop (station). Understand typos, abbreviations, accents and different languages.
Return JSON only, in this exact shape:
{"results":[{"type":"line"|"stop","label":"short readable name","page":number,"ids":[label ids that mark it on the map]}]}
Rules: at most 6 results, best match first. If the user names both a line and a stop, put the most precise match first.
Only use ids and pages that exist in the list. If nothing matches, return {"results":[]}.

User query: ${JSON.stringify(query)}

Map labels:
${payload}`);
  return (out.results||[]).map(x=>({type:x.type==='line'?'line':'stop',label:String(x.label||''),page:+x.page,ids:(x.ids||[]).filter(id=>list[id])})).filter(x=>x.ids.length);

function onTap(cx,cy){
  if(!J.open||!J.graph||J.graph.error)return;
  const sx=(cx-tx)/s,sy=(cy-ty)/s,tol=Math.max(J.graph.msz*0.9,26/s);
  let best=-1,bd=tol;
  for(const st of J.graph.stops){const d=Math.hypot(st.x-sx,st.y-sy);if(d<bd){bd=d;best=st.idx;}}
  if(best<0)return;
  let w=J.pick;if(!w)w=J.A==null?'A':(J.B==null?'B':'B');
  setStop(w,best,true);
}

async function resolveField(w){
  if(J[w]!=null)return true;
  const g=J.graph,q=norm(IN[w].value).trim();if(!q||!g||g.error)return false;
  const L=g.stops.map(x=>({x,n:norm(x.name)}));
  let hit=L.filter(o=>o.n===q);
  if(!hit.length)hit=L.filter(o=>o.n.startsWith(q));
  if(!hit.length)hit=L.filter(o=>o.n.includes(q));
  if(hit.length===1||(hit.length>1&&hit[0].n===q)){J[w]=hit[0].x.idx;J.sel[w]=J[w];IN[w].value=hit[0].x.name;return true;}
  try{
    const list=g.stops.map(x=>x.idx+'|'+x.name).join('\n');
    const out=await geminiJSON(`The user types the name of a transit stop. Pick the stop from the list that best matches, tolerating typos, accents, abbreviations and other languages.
Return JSON only: {"id": number or null}. Use null if nothing is a convincing match.
User text: ${JSON.stringify(IN[w].value)}

Stops (id|name):
${list}`);
    if(out&&Number.isInteger(out.id)&&g.stops[out.id]){J[w]=out.id;J.sel[w]=out.id;IN[w].value=g.stops[out.id].name;return true;}
  }catch{}
  if(hit.length){J[w]=hit[0].x.idx;J.sel[w]=J[w];IN[w].value=hit[0].x.name;return true;}
  return false;
}

    if(J.A===J.B){shake('B');setBody('err','Pick two different stops.');return;}

function sample(r,d){
  const cum=r.cum,n=cum.length;if(d<=0)return{x:r.pts[0][0],y:r.pts[0][1]};
  if(d>=r.total)return{x:r.pts[n-1][0],y:r.pts[n-1][1]};
  let lo=0,hi=n-1;while(hi-lo>1){const m=(lo+hi)>>1;if(cum[m]<=d)lo=m;else hi=m;}
  const t=(d-cum[lo])/((cum[hi]-cum[lo])||1);
  return{x:r.pts[lo][0]+(r.pts[hi][0]-r.pts[lo][0])*t,y:r.pts[lo][1]+(r.pts[hi][1]-r.pts[lo][1])*t};
}
function pathD(r,d0,d1){
  if(d1<=d0)return'';
  const a=sample(r,d0);let d='M'+a.x.toFixed(1)+' '+a.y.toFixed(1),cum=r.cum;
  for(let i=0;i<cum.length;i++){if(cum[i]>d0&&cum[i]<d1)d+='L'+r.pts[i][0].toFixed(1)+' '+r.pts[i][1].toFixed(1);}
  const b=sample(r,d1);return d+'L'+b.x.toFixed(1)+' '+b.y.toFixed(1);
}

async function showRoute(r,g){

function rideFrame(now){
  const R=J.ride,r=J.route,g=J.graph;if(!R||!r)return;
  if(!R.run)return;
  const p=Math.min(1,(now-R.t0)/R.dur);

  R.d=r.total*(0.6*p+0.4*eased);
  const pt=sample(r,R.d);
  R.veh.style.left=pt.x+'px';R.veh.style.top=pt.y+'px';
  const L=r.legs.find(l=>R.d>=r.cum[l.a]&&R.d<=r.cum[l.b])||r.legs[r.legs.length-1];
  R.veh.style.setProperty('--c',L.color);
  r.trail.setAttribute('d',pathD(r,Math.max(0,R.d-r.total*0.07),R.d));
  if(R.follow){
    const sf=safe(),aw=view.clientWidth-sf.l-sf.r,ah=view.clientHeight-sf.t-sf.b;
    const ns=s+(R.rs-s)*0.08,gx=sf.l+aw/2-pt.x*ns,gy=sf.t+ah/2-pt.y*ns;
    s=ns;tx+=(gx-tx)*0.12;ty+=(gy-ty)*0.12;apply();
  }

  let k=-1;for(let i=0;i<r.events.length;i++){if(r.events[i].dist<=R.d+0.5)k=i;}
  if(k!==R.ev){
    R.ev=k;
    pbody.querySelectorAll('.act').forEach(x=>x.classList.remove('act'));
    pbody.querySelectorAll('[data-ev]').forEach(x=>{const i=+x.dataset.ev,el=x.tagName==='LI'?x:x.closest('.row');if(i<=k)el.classList.add('pass');if(i===k)el.classList.add('act');});
    const a=pbody.querySelector('.act');
    if(a){const m=a.closest('.mid');if(m&&!m.classList.contains('open')){m.classList.add('open');}a.scrollIntoView({block:'center',behavior:'smooth'});}
    if(k>=0&&g)addPing(g.stops[r.events[k].stop].x,g.stops[r.events[k].stop].y,L.color);
  }
  if(p>=1){
    R.run=false;R.d=0;setRideBtn(false,'Replay ride');
    setTimeout(()=>{if(J.ride===R){R.veh.remove();r.trail.style.display='none';fitRoute();}},600);
    toast('You have arrived',g?g.stops[r.dst].name:'');
    return;
  }
  requestAnimationFrame(rideFrame);
}

const loadAuth=()=>{if(AUTH)return AUTH;try{AUTH=JSON.parse(sessionStorage.getItem('_fb')||'null');}catch{AUTH=null;}return AUTH;};

async function fbLogin(email,pw){
  const r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+FB_KEY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pw,returnSecureToken:true})});
  const j=await r.json();if(!r.ok)throw new Error((j.error&&j.error.message)||'login');

async function fbToken(){

  if(a.e>Date.now()+60000)return a.t;
  try{
    const r=await fetch('https://securetoken.googleapis.com/v1/token?key='+FB_KEY,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(a.r)});
    const j=await r.json();if(!r.ok)throw 0;

async function publishScan(say){
  if(pubBusy)return null;pubBusy=true;say=say||(()=>{});
  const startPage=cur;
  try{
    const tk=await fbToken();if(!tk)throw new Error('auth');
    await remoteP;
    FORCE=true;
    const pages={},names=[];let stopsN=0,linesN=0;
    for(let n=1;n<=pdf.numPages;n++){
      say('Scanning page '+n+' / '+pdf.numPages+'…');
      if(n!==cur)await renderPage(n);
      delete graphs[n];delete graphP[n];
      const g=await ensureGraph();
      if(!g||g.error)continue;
      const z=await zipStr(JSON.stringify(packGraph(g)));
      if(z.length>9e6)throw new Error('size');
      pages['p'+n]=z;
      for(const st of g.stops)names.push(st.name);
      stopsN+=g.stops.length;linesN+=g.colors.length;
    }
    FORCE=false;
    if(!Object.keys(pages).length)throw new Error('empty');
    const old=remoteMeta&&remoteMeta.names?JSON.parse(remoteMeta.names):[];
    const oldSet=new Set(old),newSet=new Set(names);
    const added=names.filter(x=>!oldSet.has(x)),removed=old.filter(x=>!newSet.has(x));
    const version=((remoteMeta&&remoteMeta.version)||0)+1;
    say('Publishing…');
    await fbPut(FB_PATH+'/pages',pages,tk);
    const meta={hash:curHash,version,updatedAt:Date.now(),pages:pdf.numPages,stops:stopsN,lines:linesN,names:JSON.stringify(names)};
    await fbPut(FB_PATH+'/meta',meta,tk);
    remoteMeta=meta;
    try{await fbPut('maps/history/v'+version,{hash:curHash,updatedAt:meta.updatedAt,stops:stopsN,lines:linesN,addedN:added.length,removedN:removed.length,added:added.slice(0,40),removed:removed.slice(0,40)},tk);}catch{}
    return{version,added,removed,stopsN,linesN};
  }finally{
    FORCE=false;pubBusy=false;
    if(pdf&&startPage!==cur){try{await renderPage(startPage);}catch{}}
  }
}
function autoSync(){
  remoteP.then(()=>{
    if(!pdf||!curHash||!loadAuth())return;
    if(remoteMeta&&remoteMeta.hash===curHash)return;
    publishScan().then(r=>{if(r)toast('Map re-scanned','v'+r.version+' · +'+r.added.length+' / −'+r.removed.length+' stops');}).catch(()=>{});
  });
}
function authMsg(e){
  const m=String(e&&e.message||'');
  if(/INVALID_LOGIN|INVALID_PASSWORD|EMAIL_NOT_FOUND|INVALID_EMAIL/.test(m))return 'Incorrect email or password.';
  if(/OPERATION_NOT_ALLOWED/.test(m))return 'Enable Email/Password sign-in in Firebase Authentication.';
  if(/TOO_MANY/.test(m))return 'Too many attempts. Try again later.';
  if(/^auth$/.test(m))return 'Session expired. Sign in again.';

async function check(pw){
  const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:unhex(SALT),iterations:ITER},key,256);
  const a=hex(bits);let d=0;for(let i=0;i<HASH.length;i++)d|=a.charCodeAt(i)^HASH.charCodeAt(i);
  return d===0&&a.length===HASH.length;
}

function demoPair(g){
  if(g._demo!==undefined)return g._demo;
  const n=g.stops.length;let best=null,bs=-1;
  for(let k=0;k<8&&n>3;k++){
    const a=Math.floor(n*((k*0.173+0.05)%0.45)),b=Math.floor(n*(0.55+((k*0.231+0.04)%0.43)));
    if(a===b||b>=n)continue;

    const sc=(r.transfers>0?60:0)+Math.min(r.hops,14)+(r.hops<4?-30:0);

  }
  return g._demo=best;
}

  tcard.className='tcard glass swap'+(S.hero?' hero-on':'');
  tcard.innerHTML='<div class="amb"></div>'+(S.hero?HERO:'')+
    '<div class="tseg" id="tseg"></div>'+
    '<div class="thead"><div class="tic"><svg viewBox="0 0 24 24"><path pathLength="1" d="'+IC[S.k]+'"/></svg></div><div><small id="tcnt"></small><h3>'+
      S.t.split('').map((c,k)=>'<b style="--i:'+k+'">'+(c===' '?'&nbsp;':esc(c))+'</b>').join('')+'</h3></div></div>'+
    '<p class="td"></p>'+
    '<div class="trow">'+(i>0?'<button class="tb back fx" id="tback" aria-label="Back">‹</button>':'')+(last?'':'<button class="tb skip fx" id="tskip">Skip tour</button>')+
      '<button class="tb p fx" id="tnext">'+(last?"Let's go":'Next')+'</button></div>'+
    '<div class="tkeys">← → to navigate · Esc to close</div>';
  paintSeg();
  const p=tcard.querySelector('.td');
  p.textContent=S.d;p.style.minHeight=p.offsetHeight+'px';p.textContent='';
  typeText(p,S.d,t);
  const sk=$('tskip');if(sk)sk.onclick=tutoClose;
  const bk=$('tback');if(bk)bk.onclick=()=>tutoShow(i-1);
  $('tnext').onclick=()=>last?tutoClose():tutoShow(i+1);
  $('tnext').focus({preventScroll:true});
  tutoPlace(true);
  if(!S.j&&!closed&&i>0)flyFit(600);
  if(S.run)S.run(t).catch(e=>console.error(e));
}
function tutoClose(){
  if(ti<0)return;
  ti=-1;tTok++;tutoMark();demoCleanup();
  tuto.classList.add('out');
  closeJourney();
  J.A=null;J.B=null;J.sel={A:-1,B:-1};inA.value='';inB.value='';
  setTimeout(()=>{tuto.classList.remove('show','out');},450);
  setTimeout(()=>{if(!J.open&&!J.route)fitView();},120);
}
function dropPlanner(){
  if(ti<0)return;
  const curS=STEPS[ti];if(curS.g)return;
  const nxt=STEPS.filter(x=>!x.g),idx=nxt.indexOf(curS);if(idx<0)return;
  STEPS=nxt;ti=idx;paintSeg();
}
function startTuto(){
  if(!pdf||ti>=0||$('modal').classList.contains('show'))return;
  STEPS=ALL.slice();
  $('results').classList.remove('show');
  if(J.open)closeJourney();
  tuto.classList.remove('out');tuto.classList.add('show');
  ensureGraph().then(g=>{
    if(g&&g.error)dropPlanner();
    else setTimeout(()=>{try{demoPair(g);}catch{}},700);
  }).catch(dropPlanner);
  tutoShow(0);
}
function maybeTuto(){if(!tutoSeen()&&!J.open&&!$('modal').classList.contains('show'))startTuto();}
$('helpBtn').onclick=startTuto;
setInterval(()=>tutoPlace(),280);
addEventListener('resize',()=>{if(ti>=0)tutoPlace(true);});
addEventListener('keydown',e=>{
  if(ti<0)return;
  e.stopPropagation();
  if(e.key==='Escape'){e.preventDefault();tutoClose();}
  else if(e.key==='ArrowRight'){e.preventDefault();ti<STEPS.length-1?tutoShow(ti+1):tutoClose();}
  else if(e.key==='ArrowLeft'&&ti>0){e.preventDefault();tutoShow(ti-1);}
},true);

loadMap();
})();
</script>
</body>
