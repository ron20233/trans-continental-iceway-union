<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090b0f">
<title>Transit Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#090b0f;--glass:rgba(16,19,26,.82);--edge:rgba(255,255,255,.1);--text:#f2f5fa;--muted:#8d97a9;--accent:#19a7ff}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
h3,.ttl{font-family:"Space Grotesk",Inter,system-ui,sans-serif}
#map{position:fixed;inset:0;background:var(--bg)}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.4);backdrop-filter:blur(22px) saturate(1.4);border:1px solid var(--edge);box-shadow:0 18px 50px rgba(0,0,0,.55)}
.panel{position:fixed;z-index:1000;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));width:min(380px,calc(100vw - 24px));border-radius:18px;padding:10px}
.row{display:flex;gap:8px;align-items:center}
input,button{font:inherit;color:inherit}
input{flex:1;min-width:0;background:rgba(255,255,255,.06);border:1px solid var(--edge);border-radius:12px;padding:10px 12px;outline:none}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(25,167,255,.2)}
button{cursor:pointer;background:rgba(255,255,255,.08);border:1px solid var(--edge);border-radius:12px;padding:9px 12px;transition:background .2s,transform .2s}
button:hover{background:rgba(255,255,255,.14)}button:active{transform:scale(.97)}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
button.go{background:var(--accent);border-color:transparent;color:#00121f;font-weight:600;width:100%}
#plan{display:none;margin-top:10px}#plan.open{display:block}
#plan .row{margin-bottom:8px}
#res{display:none;margin-top:8px;max-height:40vh;overflow:auto}#res.show{display:block}
.it{padding:8px 10px;border-radius:10px;cursor:pointer;display:flex;gap:8px;align-items:center}
.it:hover,.it:focus-visible{background:rgba(255,255,255,.08);outline:none}
.it small{margin-left:auto;color:var(--muted)}
.chip{display:inline-flex;align-items:center;justify-content:center;text-align:center;line-height:1;font-style:normal;font-weight:700;font-size:12px;padding:5px 9px;border-radius:99px;background:var(--c);color:#fff;margin:2px 4px 2px 0;text-shadow:0 1px 2px rgba(0,0,0,.45)}
.sum{color:var(--muted);font-size:13px;margin:4px 2px 8px}
.leg{display:flex;gap:10px;padding:8px 2px;border-top:1px solid var(--edge);font-size:14px}
.leg .chip{align-self:center;flex:none}.leg b{display:block}.leg span{color:var(--muted);font-size:13px}
.msg{color:var(--muted);font-size:13px;padding:4px 2px}
.leaflet-container{font-family:inherit}
.leaflet-bar a{background:var(--glass);color:var(--text);border-color:var(--edge)}
.leaflet-bar a:hover{background:#1d2330;color:#fff}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#10131a;color:var(--text);border:1px solid var(--edge)}
.leaflet-popup-content{margin:12px 14px}.leaflet-popup-content b{font-size:15px}
.pb{display:flex;gap:6px;margin-top:8px}.pb button{padding:5px 10px;font-size:13px}
.leaflet-tooltip.lbl{display:none;background:rgba(10,12,17,.9);color:var(--text);border:1px solid var(--edge);border-radius:8px;font-size:12px;font-weight:600;padding:2px 8px;box-shadow:none}
.leaflet-tooltip.lbl::before{display:none}
.labels .leaflet-tooltip.lbl{display:block}
.corner{position:fixed;z-index:1000;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;align-items:flex-start;max-width:calc(100vw - 96px)}
.coords{border-radius:10px;padding:5px 10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.kbtn{padding:5px 12px;font-size:12px;border-radius:10px}
.legend{border-radius:14px;padding:8px 12px}.legend[hidden]{display:none}
.legend div{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:13px}
.legend img{height:24px;width:auto}
.legend i{width:16px;height:16px;border-radius:50%;border:3px solid #10131a;background:#fff;display:inline-block;flex:none}
.legend i.dk{background:#231f20;border-color:#fff}
.ico{display:none}.icons .ico{display:block}
.ico img{position:absolute;left:0;top:0;max-width:none;width:calc(var(--w) * var(--k) * 1px);height:calc(var(--h) * var(--k) * 1px)}
.legend i.gr{background:#00ff00;border-color:#00ff00;width:10px;height:10px;margin:0 3px}
.note{position:fixed;z-index:1000;right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));border-radius:10px;padding:5px 10px;font-size:12px;color:var(--muted)}
@media(max-width:760px){.note{top:calc(max(12px,env(safe-area-inset-top)) + 66px)}}
.co{margin-top:6px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}.co span{color:var(--text);font-weight:600}
.gt{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;color:var(--muted)}.gt i{width:8px;height:8px;border-radius:50%;background:#00ff00;display:inline-block}
.banner{position:fixed;z-index:1100;left:50%;bottom:24px;transform:translateX(-50%);max-width:min(480px,calc(100vw - 24px));padding:12px 16px;border-radius:14px;font-size:14px}
.banner[hidden]{display:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="map"></div>
<div class="note glass" id="note">All iceways at y=125 in Nether</div>
<div class="corner">
  <div class="legend glass" id="legend" hidden role="group" aria-label="Map key">
    <div><i></i>Line transfer available</div>
    <div><i class="dk"></i>No line transfer available</div>
    <div><img id="kx" alt="">Lines intersect</div>
    <div><img id="km" alt="">Lines merging</div>
    <div><i class="gr"></i>Station available in town</div>
  </div>
  <div class="row"><button class="glass kbtn" id="keyb" aria-expanded="false" aria-controls="legend">Key</button><div class="coords glass" id="coords" aria-hidden="true">x –, z –</div></div>
</div>
<div class="banner glass" id="banner" role="alert" hidden></div>

<section class="panel glass" aria-label="Search and journey planner">
  <div class="row">
    <input id="q" type="search" placeholder="Search a line or a stop" autocomplete="off" aria-label="Search a line or a stop">
    <button id="tog" aria-expanded="false" aria-controls="plan">Route</button>
  </div>
  <div id="res" role="listbox"></div>
  <div id="plan">
    <div class="row"><input id="inA" list="dl" placeholder="From" autocomplete="off" aria-label="Departure"></div>
    <div class="row"><input id="inB" list="dl" placeholder="To" autocomplete="off" aria-label="Arrival">
      <button id="swap" aria-label="Swap departure and arrival">⇅</button></div>
    <button class="go" id="go">Find route</button>
    <div id="out"></div>
  </div>
  <datalist id="dl"></datalist>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

   1. SQUAREMAP – paste the address of your squaremap site here
   ============================================================ */
const MAP = {
  // Address of the site squaremap publishes, ending in "/" (for example 'https://map.example.com/').
  // Leave '' if squaremap's "tiles" folder sits next to this file.
  url: 'https://map.earthmc.net/',
  // World to show, as named in the tiles folder (for example 'minecraft_overworld').
  // null = the first world listed in tiles/settings.json.
  world: 'minecraft_overworld',
  // Only needed if this page can't read settings.json from your squaremap site.
  // Copy the values from tiles/<world>/settings.json, for example { max: 3, def: 1, extra: 2 }.
  zoom: { max: 5, def: 0, extra: 2 },
  // Where the map opens, in overworld coordinates: { x: 0, z: 0, zoom: 2 }. null = fit the whole transit network.
  start: { x: 5000, z: 5000, zoom: 0 }
};

/* ============================================================
   2. TRAVEL TIME – the whole network is in the Nether
   ------------------------------------------------------------
   Distances are measured in Nether blocks, so journeys take 1/8 of the
   time the same trip would take in the overworld. Change these numbers
   to match how fast people really travel:
     speed    = blocks per second on the ice (a boat on blue ice is roughly 72)
     transfer = seconds lost each time you change line at a stop
     crossing = seconds lost when you change line at an intersection (the
                "Lines intersect" symbols). The iceways meet there, so you
                just turn onto the other one, so you could lower this
                if that feels quicker than changing at a stop.
   ============================================================ */

           a: 1 if c is only approximate, t: 1 if line transfer available,

});
map.on('mousemove', e => {
  const x = e.latlng.lng / scale, z = -e.latlng.lat / scale;
  $('coords').textContent = 'Overworld ' + Math.round(x) + ', ' + Math.round(z) + '  ·  Nether ' + Math.round(x / NS) + ', ' + Math.round(z / NS);
});

/* ---- lines: straight and crisp, drawn like the PDF ---- */
/* k = screen pixels per PDF point. The PDF is 16 overworld blocks per point; k is capped so
   lines stay readable when zoomed in, and lines, dots and symbols all use the same k. */
const kNow = () => Math.max(0.4, Math.min(1.5, 16 * Math.pow(2, map.getZoom() - zoom.max)));
const lineW = () => 5 * kNow();
/* Rounded corners. The radius follows the line width, so the curve looks the same at every zoom;
   it is limited by the length of the segments next to each corner. */
const cornerR = () => 6 * kNow() / (NS * Math.pow(2, map.getZoom() - zoom.max));
function smooth(pts, r) {
  const p = pts.filter((v, i) => !i || Math.hypot(v[0] - pts[i - 1][0], v[1] - pts[i - 1][1]) > 1e-6);
  if (p.length < 3 || r <= 0) return p;
  const out = [p[0]];
  for (let i = 1; i < p.length - 1; i++) {
    const a = p[i - 1], b = p[i], c = p[i + 1];
    const d1 = Math.hypot(a[0] - b[0], a[1] - b[1]), d2 = Math.hypot(c[0] - b[0], c[1] - b[1]);
    if (Math.abs(((b[0] - a[0]) * (c[1] - b[1]) - (b[1] - a[1]) * (c[0] - b[0])) / (d1 * d2)) < 1e-3) { out.push(b); continue; }
    const t = Math.min(r, d1 / 2, d2 / 2);
    const e = [b[0] + (a[0] - b[0]) * t / d1, b[1] + (a[1] - b[1]) * t / d1], x = [b[0] + (c[0] - b[0]) * t / d2, b[1] + (c[1] - b[1]) * t / d2];
    out.push(e);
    for (let n = 1; n < 8; n++) { const u = n / 8, v = 1 - u; out.push([v * v * e[0] + 2 * u * v * b[0] + u * u * x[0], v * v * e[1] + 2 * u * v * b[1] + u * u * x[1]]); }
    out.push(x);
  }
  out.push(p[p.length - 1]);
  return out;
}
function joinChains(geoms) {   // join paths that meet end to end, so corners at stops get rounded too
  let cs = geoms.map(g => g.slice());
  const key = p => p[0].toFixed(2) + ',' + p[1].toFixed(2);
  for (;;) {
    const ends = {};
    cs.forEach((c, i) => [[0, c[0]], [1, c[c.length - 1]]].forEach(([side, p]) => (ends[key(p)] = ends[key(p)] || []).push([i, side])));
    const hit = Object.values(ends).find(v => v.length === 2 && v[0][0] !== v[1][0]);
    if (!hit) return cs;
    const [[i, si], [j, sj]] = hit;
    const a = si ? cs[i] : cs[i].slice().reverse(), b = sj ? cs[j].slice().reverse() : cs[j];
    cs = cs.filter((_, n) => n !== i && n !== j); cs.push(a.concat(b.slice(1)));
  }
}
const routeSegs = [];
LINES.forEach(l => {
  const g = l.geoms.map(p => p.map(P));
  l.chains = joinChains(l.geoms);
  l.core = L.polyline(l.chains.map(c => smooth(c, cornerR()).map(P)), { color: l.color, weight: 5, opacity: 1, lineCap: 'square', lineJoin: 'round', smoothFactor: 0, interactive: false }).addTo(map);
  l.bounds = L.latLngBounds(g.flat());
});
function dim(except) {
  LINES.forEach(l => l.core.setStyle({ opacity: except && !except.includes(l.id) ? 0.15 : 1 }));
}

/* ---- intersection and merge symbols: same place, angle and size as the PDF ---- */
ICONS.forEach(i => {
  L.marker(P([i[1], i[2]]), { interactive: false, keyboard: false, icon: L.divIcon({
    className: 'ico', iconSize: [0, 0],
    html: `<img alt="" src="${i[0] === 'c' ? IMG.cross : IMG.merge}" style="--w:${i[4]};--h:${i[5]};transform:translate(-50%,-50%) rotate(${i[3]}deg)">`
  }) }).addTo(map);
});
$('kx').src = IMG.cross; $('km').src = IMG.merge;
$('keyb').onclick = () => { const o = $('legend').hidden; $('legend').hidden = !o; $('keyb').setAttribute('aria-expanded', o); };

/* ---- stops ---- */
const chips = list => [...list].map(id => `<i class="chip" style="--c:${LBY[id].color}">${esc(LBY[id].name)}</i>`).join('');
const hub = s => !!STOPS[s].t || linesAt[s].size > 1;      // white circle = line transfer available
ids.forEach(s => {
  const st = STOPS[s], h = hub(s);
  st.ll = P(st.p);
  st.marker = L.circleMarker(st.ll, { radius: 7, color: h ? '#231f20' : '#fff', weight: 1.5, fillColor: h ? '#fff' : '#231f20', fillOpacity: 1, opacity: 1 })
    .bindTooltip(esc(st.n), { permanent: true, direction: 'right', offset: [12, 0], className: 'lbl' })
    .bindPopup(() => `<b>${esc(st.n)}</b><div>${chips(linesAt[s])}</div>` +
      `<div class="co">Nether${st.a ? ' (approx.)' : ''}: <span>${st.c[0]}, ${st.c[1]}</span></div>` +
      (st.g ? '<div class="gt"><i></i>Station available in town</div>' : '') +
      `<div class="pb"><button data-a="A" data-s="${s}">From here</button><button data-a="B" data-s="${s}">To here</button></div>`)
    .addTo(map);
  if (st.g) st.dot = L.circleMarker(st.ll, { radius: 2.5, stroke: false, fillColor: '#00ff00', fillOpacity: 1, interactive: false }).addTo(map);
});

const labelZoom = Math.max(0, zoom.max - 1), iconZoom = Math.max(0, zoom.max - 4);
function syncZoom() {
  const z = map.getZoom(), m = $('map'), k = kNow();
  m.classList.toggle('labels', z >= labelZoom); m.classList.toggle('icons', z >= iconZoom);
  m.style.setProperty('--k', k);
  LINES.forEach(l => l.core.setStyle({ weight: 5 * k }));
  const cr = cornerR();
  LINES.forEach(l => l.core.setLatLngs(l.chains.map(c => smooth(c, cr).map(P))));
  routeSegs.forEach(g => { const q = smooth(g.g, cr).map(P); g.white.setLatLngs(q).setStyle({ weight: lineW() + 8 }); g.color.setLatLngs(q).setStyle({ weight: lineW() + 3 }); });
  ids.forEach(s => { const st = STOPS[s]; st.marker.setRadius(7 * k); st.marker.setStyle({ weight: Math.max(1, k) }); if (st.dot) st.dot.setRadius(2.5 * k); });
}
map.on('zoomend', syncZoom);

/* ---- start view ---- */
if (MAP.start) map.setView(OW(MAP.start.x, MAP.start.z), MAP.start.zoom == null ? zoom.def : MAP.start.zoom);
else map.fitBounds(L.latLngBounds(ids.map(s => STOPS[s].ll)).pad(0.1), { maxZoom: zoom.max });
syncZoom();
map.on('click', () => { dim(null); });

/* ---- search ---- */
const res = $('res');
function flyStop(s) { map.flyTo(STOPS[s].ll, Math.min(zoom.max, Math.max(map.getZoom(), labelZoom + 1)), { duration: 0.8 }); STOPS[s].marker.openPopup(); }
function flyLine(l) { map.flyToBounds(l.bounds.pad(0.2), { duration: 0.8 }); dim([l.id]); }
function search() {
  const q = norm($('q').value).trim(); res.innerHTML = '';
  if (!q) { res.classList.remove('show'); return; }
  const hits = [
    ...LINES.filter(l => norm(l.name).includes(q) || norm(l.id) === q).map(l => ({ label: l.name, kind: 'line', go: () => flyLine(l), c: l.color })),
    ...ids.filter(s => norm(STOPS[s].n).includes(q)).map(s => ({ label: STOPS[s].n, kind: 'stop', go: () => flyStop(s) }))
  ].slice(0, 8);
  if (!hits.length) res.innerHTML = '<div class="msg">No result found.</div>';
  hits.forEach(h => {
    const d = document.createElement('div'); d.className = 'it'; d.tabIndex = 0; d.setAttribute('role', 'option');
    d.innerHTML = (h.c ? `<i class="chip" style="--c:${h.c}">&nbsp;</i>` : '') + `<span>${esc(h.label)}</span><small>${h.kind}</small>`;
    const pick = () => { res.classList.remove('show'); h.go(); };
    d.onclick = pick; d.onkeydown = e => { if (e.key === 'Enter') pick(); };
    res.appendChild(d);
  });
  res.classList.add('show');
}
$('q').addEventListener('input', search);
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') { const f = res.querySelector('.it'); if (f) f.click(); } });

/* ---- journey planner ---- */
$('dl').innerHTML = ids.map(s => `<option value="${esc(STOPS[s].n)}">`).join('');
const planEl = $('plan');
function openPlan(on) { planEl.classList.toggle('open', on); $('tog').setAttribute('aria-expanded', on); if (!on) clearRoute(); }
$('tog').onclick = () => openPlan(!planEl.classList.contains('open'));
$('swap').onclick = () => { const t = $('inA').value; $('inA').value = $('inB').value; $('inB').value = t; if (t && $('inA').value) go(); };
map.on('popupopen', e => e.popup.getElement().querySelectorAll('button[data-a]').forEach(b => b.onclick = () => {
  openPlan(true); ($(b.dataset.a === 'A' ? 'inA' : 'inB')).value = STOPS[b.dataset.s].n; map.closePopup();
  if ($('inA').value && $('inB').value) go();
}));

let routeLayer = null;
function clearRoute() { routeSegs.length = 0; if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; } dim(null); $('out').innerHTML = ''; }
function find(v) {
  const q = norm(v).trim(); if (!q) return null;
  return ids.find(s => norm(STOPS[s].n) === q) || ids.find(s => norm(STOPS[s].n).includes(q)) || null;
}
function go() {
  clearRoute();
  const a = find($('inA').value), b = find($('inB').value), out = $('out');
  if (!a || !b) { out.innerHTML = '<div class="msg">Choose a departure and an arrival from the list, or tap two stops on the map.</div>'; return; }
  if (a === b) { out.innerHTML = '<div class="msg">Departure and arrival are the same stop.</div>'; return; }
  const r = route(a, b);
  if (!r || !r.legs.length) { out.innerHTML = '<div class="msg">No route found between these stops.</div>'; return; }
  routeLayer = L.layerGroup().addTo(map); dim([]);
  const all = [], legs = r.legs.map(l => ({ line: l.line, g: l.edges.reduce((a, e) => {
    const f = e.g[0], z = a[a.length - 1];
    return a.concat(z && z[0] === f[0] && z[1] === f[1] ? e.g.slice(1) : e.g);
  }, []) }));
  const mk = (l, color, extra) => L.polyline(smooth(l.g, cornerR()).map(P), { color, weight: lineW() + extra, lineCap: 'square', lineJoin: 'round', interactive: false }).addTo(routeLayer);
  const whites = legs.map(l => mk(l, '#fff', 8));        // white outlines first, so no outline covers a neighbouring leg
  legs.forEach((l, i) => { routeSegs.push({ g: l.g, white: whites[i], color: mk(l, LBY[l.line].color, 3) }); all.push(...l.g.map(P)); });
  map.flyToBounds(L.latLngBounds(all).pad(0.3), { duration: 0.8, maxZoom: zoom.max });
  const xf = r.legs.length - 1;
  out.innerHTML = `<div class="sum">About ${fmt(r.sec)} · ${xf} transfer${xf === 1 ? '' : 's'} · ${Math.round(r.blocks).toLocaleString('en-US')} blocks in the Nether</div>` +
    r.legs.map(l => { const n = l.stops.slice(1).filter(s => STOPS[s]).length;
      return `<div class="leg"><i class="chip" style="--c:${LBY[l.line].color}">${esc(LBY[l.line].name)}</i><div><b>${esc(nodeName(l.stops[0]))} to ${esc(nodeName(l.stops[l.stops.length - 1]))}</b><span>${n} stop${n === 1 ? '' : 's'} · ${fmt(l.sec)}</span></div></div>`; }).join('');
}
$('go').onclick = go;
['inA', 'inB'].forEach(i => $(i).addEventListener('keydown', e => { if (e.key === 'Enter') go(); }));
})();
</script>
</body>
</html>
