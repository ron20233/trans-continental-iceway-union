<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07090d" id="themec">
<title>Transit Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
:root{
  --bg:#07090d;--glass:rgba(13,16,23,.74);--glass2:rgba(255,255,255,.055);--glass3:rgba(255,255,255,.1);
  --edge:rgba(255,255,255,.11);--text:#f2f5fa;--muted:#8d97a9;--accent:#19a7ff;--accent2:#7c5cff;--ok:#2ee59d;
  --pop:#10131a;--tip:rgba(10,12,17,.92);--shadow:0 22px 60px rgba(0,0,0,.55);--dim:1;--ease:cubic-bezier(.2,.9,.2,1);
}
[data-theme=light]{
  --bg:#e8edf4;--glass:rgba(255,255,255,.78);--glass2:rgba(15,25,45,.05);--glass3:rgba(15,25,45,.09);
  --edge:rgba(15,25,45,.12);--text:#0e1726;--muted:#5a6578;--accent:#0a84d6;--accent2:#6b4de6;
  --pop:#fff;--tip:rgba(255,255,255,.95);--shadow:0 20px 50px rgba(30,45,80,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;overflow:hidden;transition:background .4s,color .4s}
.ttl,h3,.big{font-family:"Space Grotesk",Inter,system-ui,sans-serif}
#map{position:fixed;inset:0;background:var(--bg)}
.leaflet-tile-pane{filter:brightness(var(--dim));transition:filter .4s}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);border:1px solid var(--edge);box-shadow:var(--shadow)}
svg{display:block}
input,button{font:inherit;color:inherit}
button{cursor:pointer;background:var(--glass2);border:1px solid var(--edge);border-radius:12px;padding:9px 12px;transition:background .2s,transform .2s var(--ease),border-color .2s,box-shadow .2s}
button:hover{background:var(--glass3)}
button:active{transform:scale(.96)}
button:focus-visible,input:focus-visible,.it:focus-visible,.aci:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:600;font-size:13px}
.btn svg{width:16px;height:16px;flex:none}
.btn.pri{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:#fff;box-shadow:0 8px 24px -6px var(--accent)}
.btn.pri::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.4) 50%,transparent 70%);transform:translateX(-120%);transition:transform .7s var(--ease)}
.btn.pri:hover{background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 10px 30px -4px var(--accent)}
.btn.pri:hover::after{transform:translateX(120%)}
.ib{width:38px;height:38px;padding:0;display:grid;place-items:center;border-radius:12px;flex:none}
.ib svg{width:18px;height:18px}
.ib.on{background:var(--accent);border-color:transparent;color:#fff}
.row{display:flex;gap:8px;align-items:center}

/* ---------- panel ---------- */
.panel{position:fixed;z-index:1000;left:max(14px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));width:min(400px,calc(100vw - 28px));max-height:calc(100dvh - 28px);display:flex;flex-direction:column;border-radius:24px;overflow:hidden;animation:panelIn .9s var(--ease) .2s both}
.panel::before{content:"";position:absolute;inset:-40%;background:radial-gradient(circle at 18% 18%,rgba(25,167,255,.25),transparent 38%),radial-gradient(circle at 85% 8%,rgba(124,92,255,.22),transparent 38%),radial-gradient(circle at 60% 95%,rgba(46,229,157,.12),transparent 40%);filter:blur(34px);animation:aurora 16s ease-in-out infinite alternate;pointer-events:none}
.panel::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:conic-gradient(from var(--ang),transparent 0 72%,var(--accent) 86%,var(--accent2) 94%,transparent 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:spin 7s linear infinite;pointer-events:none;opacity:.8}
.panel>*{position:relative;z-index:1}
.grab{display:none;width:44px;height:5px;border-radius:9px;background:var(--glass3);margin:8px auto 0;border:0;padding:0}
.ph{padding:12px 12px 8px}
.brand{display:flex;align-items:center;gap:10px;margin:0 2px 10px}
.logo{width:34px;height:34px;flex:none;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;box-shadow:0 8px 20px -6px var(--accent)}
.logo svg{width:22px;height:22px}
.logo path{stroke-dasharray:60;stroke-dashoffset:60;animation:draw 2.4s var(--ease) 1s infinite alternate}
.brand h1{margin:0;font-size:17px;letter-spacing:-.01em;line-height:1.1}
.brand small{color:var(--muted);font-size:11.5px}
.brand .grow{flex:1}
.srch{position:relative}
.srch>svg{position:absolute;left:12px;top:50%;width:17px;height:17px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
input{width:100%;min-width:0;background:var(--glass2);border:1px solid var(--edge);border-radius:14px;padding:11px 12px;outline:none;transition:border-color .2s,box-shadow .25s,background .2s}
input:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent);background:var(--glass3)}
.srch input{padding-left:38px;padding-right:44px}
.srch kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:600 11px Inter;color:var(--muted);border:1px solid var(--edge);border-radius:6px;padding:2px 7px;pointer-events:none;transition:opacity .2s}
.srch input:not(:placeholder-shown)~kbd{opacity:0}
.srch .x{position:absolute;right:6px;top:50%;transform:translateY(-50%) scale(.6);width:28px;height:28px;padding:0;opacity:0;pointer-events:none;border-radius:9px}
.srch input:not(:placeholder-shown)~.x{opacity:1;pointer-events:auto;transform:translateY(-50%)}
input[type=search]::-webkit-search-cancel-button{display:none}
#res{display:none;margin-top:8px;max-height:36vh;overflow:auto}
#res.show{display:block;animation:paneIn .3s var(--ease)}
.it{padding:8px 10px;border-radius:12px;cursor:pointer;display:flex;gap:9px;align-items:center;font-size:14px;transition:background .15s,transform .2s var(--ease);animation:slideUp .35s var(--ease) both;animation-delay:calc(var(--i,0)*.03s)}
.it:hover,.it.act{background:var(--glass3);transform:translateX(3px)}
.it small{margin-left:auto;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.ld{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:3px;border:1px solid rgba(255,255,255,.35)}
.lds{display:inline-flex;flex-wrap:wrap;gap:0;margin-left:auto;padding-left:6px}
.fold{display:grid;grid-template-rows:1fr;transition:grid-template-rows .45s var(--ease);min-height:0;flex:1}
.panel.min .fold{grid-template-rows:0fr}
.foldin{overflow:hidden;min-height:0;display:flex;flex-direction:column}
.tabs{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin:2px 12px 0;padding:4px;background:var(--glass2);border:1px solid var(--edge);border-radius:14px;flex:none}
.tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:7px 4px;font-size:11.5px;font-weight:600;color:var(--muted);border-radius:10px}
.tab svg{width:17px;height:17px;transition:transform .35s var(--ease)}
.tab:hover{background:none;color:var(--text)}
.tab.on{color:#fff}
.tab.on svg{transform:translateY(-1px) scale(1.12)}
.ind{position:absolute;z-index:0;left:0;top:4px;bottom:4px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 6px 18px -6px var(--accent);transition:transform .45s var(--ease),width .45s var(--ease)}
.body{padding:12px;overflow:auto;overscroll-behavior:contain;flex:1;min-height:0}
.body::-webkit-scrollbar,#res::-webkit-scrollbar{width:6px}
.body::-webkit-scrollbar-thumb,#res::-webkit-scrollbar-thumb{background:var(--glass3);border-radius:9px}
.pane{display:none}
.pane.on{display:block;animation:paneIn .4s var(--ease) both}

/* chips */
.chip{display:inline-flex;align-items:center;justify-content:center;text-align:center;line-height:1;font-style:normal;font-weight:700;font-size:12px;padding:5px 10px;border-radius:99px;background:var(--c);color:var(--t,#fff);margin:2px 4px 2px 0;box-shadow:0 2px 8px -2px var(--c);transition:transform .2s var(--ease),box-shadow .2s}
[data-line]{cursor:pointer}
[data-line]:hover{transform:translateY(-2px) scale(1.06);box-shadow:0 6px 14px -3px var(--c)}
.chip.w{min-width:34px}

/* planner */
.fld{position:relative;margin-bottom:8px}
.fld input{padding-left:42px;padding-right:46px}
.pin2{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:700 11px Inter;color:#fff;background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent);pointer-events:none}
.pin2.b{background:var(--ok);color:#00201a;box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 25%,transparent)}
.swap{position:absolute;right:6px;top:-26px;z-index:3;width:32px;height:32px;padding:0;border-radius:50%;display:grid;place-items:center;background:var(--pop);transition:transform .5s var(--ease)}
.swap svg{width:16px;height:16px}
.swap.spin{transform:rotate(180deg)}
.ac{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--pop);border:1px solid var(--edge);border-radius:16px;padding:5px;z-index:6;display:none;box-shadow:var(--shadow);max-height:230px;overflow:auto}
.ac.on{display:block;animation:pop .22s var(--ease)}
.aci{display:flex;align-items:center;padding:8px 10px;border-radius:11px;cursor:pointer;font-size:14px}
.aci.act,.aci:hover{background:var(--glass3)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:3px;background:var(--glass2);border:1px solid var(--edge);border-radius:13px;margin:4px 0 10px;position:relative}
.seg button{border:0;background:none;font-size:12.5px;font-weight:600;color:var(--muted);padding:8px 6px;position:relative;z-index:1}
.seg button.on{color:#fff}
.seg i{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 4.5px);border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));transition:transform .4s var(--ease)}
.seg.r i{transform:translateX(calc(100% + 3px))}
.acts{display:flex;gap:8px}
.acts .go{flex:1;padding:11px}
.acts .dice:hover svg{animation:roll .6s var(--ease)}
.msg{color:var(--muted);font-size:13px;padding:10px 4px;animation:paneIn .3s}
.msg.err{color:#ff8a8a}
h4{margin:14px 2px 6px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.rc{display:flex;align-items:center;gap:8px;width:100%;text-align:left;margin-bottom:5px;font-size:13px;padding:9px 11px;animation:slideUp .35s var(--ease) both;animation-delay:calc(var(--i,0)*.05s)}
.rc svg{width:14px;height:14px;color:var(--muted);flex:none}
.rc span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc .del{padding:2px 7px;border:0;background:none;color:var(--muted)}

/* route result */
.rs{margin-top:14px;animation:paneIn .4s var(--ease)}
.rs-top{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:8px}
.stat{background:var(--glass2);border:1px solid var(--edge);border-radius:14px;padding:9px 11px}
.stat b{display:block;font-family:"Space Grotesk";font-size:20px;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
.stat span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.stat.main b{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.bar{display:flex;height:10px;border-radius:99px;overflow:hidden;gap:2px;margin:12px 0 6px;background:var(--glass2)}
.bar i{flex:var(--w) 1 0;background:var(--c);transform-origin:left;animation:grow .8s var(--ease) both;animation-delay:calc(var(--i)*.1s)}
.leg{display:flex;gap:11px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--edge);border-radius:0;padding:10px 2px;font-size:14px;animation:slideUp .5s var(--ease) both;animation-delay:calc(.15s + var(--i)*.09s)}
.leg:hover{background:var(--glass2);border-radius:12px;border-color:transparent;padding-left:8px}
.leg .chip{flex:none;margin:0}
.leg b{display:block;font-weight:600}
.leg span{color:var(--muted);font-size:12.5px}
.leg .chev{margin-left:auto;width:16px;height:16px;color:var(--muted);transition:transform .2s}
.leg:hover .chev{transform:translateX(3px)}
.xfer{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);padding:2px 0 2px 12px;animation:slideUp .5s var(--ease) both;animation-delay:calc(.2s + var(--i)*.09s)}
.xfer svg{width:13px;height:13px}
.rs-acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.rs-acts button{flex:1;padding:8px 6px;font-size:12.5px;min-width:70px}

/* lines pane */
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin-top:10px}
.lc{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:10px;border-radius:14px;text-align:left;position:relative;overflow:hidden;animation:slideUp .45s var(--ease) both;animation-delay:calc(var(--i)*.025s)}
.lc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c);box-shadow:0 0 14px var(--c)}
.lc .chip{margin:0}
.lc small{color:var(--muted);font-size:11.5px}
.lc.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent)}
.hint{color:var(--muted);font-size:12.5px;margin:2px 2px 0}

/* favs */
.fav{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.fav .main{flex:1;min-width:0;text-align:left;display:flex;align-items:center;gap:8px;font-size:14px}
.fav .main span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fav .ib{width:34px;height:34px}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:26px 10px;line-height:1.5}
.empty svg{width:34px;height:34px;margin:0 auto 8px;opacity:.6}

/* settings */
.set{margin-bottom:14px}
.set label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.set label output{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;padding:0;height:6px;border-radius:9px;border:0;background:linear-gradient(90deg,var(--accent) var(--p,50%),var(--glass3) var(--p,50%));box-shadow:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--accent);box-shadow:0 2px 10px rgba(0,0,0,.4);cursor:pointer;transition:transform .2s var(--ease)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--accent);cursor:pointer}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.25)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.about{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.about .stat{padding:8px 6px;text-align:center}
.about .stat b{font-size:17px}
.about .stat span{font-size:9.5px;letter-spacing:.04em}
.link{display:block;width:100%;margin-top:8px}

/* floating ui */
.tr{position:fixed;z-index:1000;right:max(14px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));display:flex;gap:8px;align-items:center;animation:fadeDown .8s var(--ease) .5s both}
.note{border-radius:12px;padding:8px 12px;font-size:12px;color:var(--muted)}
.tools{display:flex;gap:6px;padding:5px;border-radius:15px}
.tools .ib{width:36px;height:36px;background:none;border:0}
.tools .ib:hover{background:var(--glass3)}
.corner{position:fixed;z-index:1000;left:max(14px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;align-items:flex-start;max-width:calc(100vw - 96px);animation:fadeUp .8s var(--ease) .7s both;pointer-events:none}
.corner>*{pointer-events:auto}
.coords{border-radius:12px;padding:7px 12px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.kbtn{padding:7px 14px;font-size:12px;font-weight:600;border-radius:12px;display:flex;align-items:center;gap:6px}
.kbtn svg{width:14px;height:14px}
.legend{border-radius:16px;padding:10px 14px;transform-origin:bottom left;opacity:0;transform:scale(.85) translateY(10px);pointer-events:none;visibility:hidden;transition:opacity .25s,transform .35s var(--ease),visibility .25s}
.legend.on{opacity:1;transform:none;pointer-events:auto;visibility:visible}
.legend div{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.legend img{height:24px;width:auto}
.legend i{width:16px;height:16px;border-radius:50%;border:3px solid var(--pop);background:#fff;display:inline-block;flex:none}
.legend i.dk{background:#231f20;border-color:#fff}
.legend i.gr{background:#00ff00;border-color:#00ff00;width:10px;height:10px;margin:0 3px}
.ico{display:none}.icons .ico{display:block}
.ico img{position:absolute;left:0;top:0;max-width:none;width:calc(var(--w) * var(--k) * 1px);height:calc(var(--h) * var(--k) * 1px)}
.fpill{position:fixed;z-index:1001;top:max(14px,env(safe-area-inset-top));left:50%;transform:translate(-50%,-90px);display:flex;align-items:center;gap:10px;padding:7px 8px 7px 14px;border-radius:99px;font-size:13px;font-weight:600;transition:transform .5s var(--ease);max-width:calc(100vw - 28px)}
.fpill.on{transform:translate(-50%,0)}
.fpill .ib{width:28px;height:28px;border-radius:50%}
.fpill .ib svg{width:14px;height:14px}
.toasts{position:fixed;z-index:1400;left:50%;bottom:26px;transform:translateX(-50%);display:grid;gap:8px;justify-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 24px)}
.toast{padding:10px 16px;border-radius:14px;font-size:13.5px;font-weight:500;animation:toastIn .5s var(--ease) both}
.toast.out{animation:toastOut .35s ease both}
.banner{position:fixed;z-index:1100;left:50%;top:50%;transform:translate(-50%,-50%);max-width:min(480px,calc(100vw - 24px));padding:14px 18px;border-radius:16px;font-size:14px}
.banner[hidden]{display:none}

/* leaflet */
.leaflet-container{font-family:inherit;background:var(--bg)}
.leaflet-bar{border:0!important;box-shadow:var(--shadow)!important;border-radius:14px!important;overflow:hidden}
.leaflet-bar a{background:var(--glass);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);color:var(--text);border-color:var(--edge);width:38px;height:38px;line-height:38px;transition:background .2s}
.leaflet-bar a:hover{background:var(--glass3);color:var(--text)}
.leaflet-bottom.leaflet-right{margin-bottom:max(4px,env(safe-area-inset-bottom))}
.leaflet-popup-content-wrapper{background:var(--pop);color:var(--text);border:1px solid var(--edge);border-radius:18px;box-shadow:var(--shadow)}
.leaflet-popup-tip{background:var(--pop);border:1px solid var(--edge)}
.leaflet-popup-content{margin:14px 16px;min-width:200px}
.leaflet-popup-content b.pt{font-size:16px;font-family:"Space Grotesk"}
.leaflet-popup-close-button{color:var(--muted)!important}
.leaflet-popup{animation:popup .35s var(--ease)}
.ph2{display:flex;align-items:center;gap:8px;justify-content:space-between}
.star{width:32px;height:32px;padding:0;display:grid;place-items:center;border-radius:10px;flex:none}
.star svg{width:17px;height:17px;transition:transform .4s var(--ease),fill .2s}
.star.on{color:#ffc933;border-color:#ffc93355}
.star.on svg{fill:#ffc933;animation:starp .5s var(--ease)}
.co{margin-top:8px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
.co span{color:var(--text);font-weight:600}
.co button{padding:2px 8px;font-size:11.5px;border-radius:8px}
.gt{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;color:var(--muted)}.gt i{width:8px;height:8px;border-radius:50%;background:#00ff00;display:inline-block;box-shadow:0 0 8px #00ff00}
.pb{display:flex;gap:6px;margin-top:10px}.pb button{flex:1;padding:7px 8px;font-size:12.5px;font-weight:600}
.pb button.a{background:var(--accent);border-color:transparent;color:#fff}
.pb button.b{background:var(--ok);border-color:transparent;color:#00201a}
.leaflet-tooltip.lbl{display:none;background:var(--tip);color:var(--text);border:1px solid var(--edge);border-radius:9px;font-size:12px;font-weight:600;padding:3px 9px;box-shadow:0 4px 14px rgba(0,0,0,.3);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.leaflet-tooltip.lbl::before{display:none}
.labels .leaflet-tooltip.lbl,.leaflet-tooltip.lbl.peek{display:block}
.stop{cursor:pointer;transition:transform .25s var(--ease);transform-box:fill-box;transform-origin:center;animation:popIn .6s var(--ease) backwards;animation-delay:var(--d,0s)}
.stop:hover{transform:scale(1.5)}
.pinm{position:relative}
.pinm div{position:absolute;left:-16px;top:-42px;width:32px;height:42px;animation:drop .7s cubic-bezier(.3,1.5,.5,1) both}
.pinm i{display:block;width:28px;height:28px;margin:2px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--pc);border:2.5px solid #fff;box-shadow:0 6px 16px rgba(0,0,0,.5)}
.pinm b{position:absolute;left:0;right:0;top:2px;height:28px;display:grid;place-items:center;font:700 12px Inter;color:#fff}
.train{position:absolute;left:-10px;top:-10px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 40%,transparent),0 0 24px 8px var(--accent);animation:beat .8s ease-in-out infinite;transition:opacity .4s}
.train.out{opacity:0}
.pulse{position:absolute;left:-34px;top:-34px;width:68px;height:68px;border-radius:50%;border:3px solid var(--accent);animation:ring 1.5s ease-out 3 both;pointer-events:none}
.pulse::after{content:"";position:absolute;inset:26px;border-radius:50%;background:var(--accent)}

/* tour */
#tour{position:fixed;inset:0;z-index:2000;display:none}
#tour.on{display:block}
.tshield{position:absolute;inset:0}
.tspot{position:fixed;border-radius:18px;box-shadow:0 0 0 9999px rgba(3,6,12,.74),0 0 0 2px var(--accent),0 0 34px 6px color-mix(in srgb,var(--accent) 55%,transparent);transition:left .5s var(--ease),top .5s var(--ease),width .5s var(--ease),height .5s var(--ease);pointer-events:none;animation:spotp 2s ease-in-out infinite}
.tcard{position:fixed;width:min(350px,calc(100vw - 24px));padding:18px;border-radius:22px;transition:left .5s var(--ease),top .5s var(--ease);background:var(--pop);border:1px solid var(--edge);box-shadow:var(--shadow)}
.tcard .tb{animation:paneIn .45s var(--ease)}
.tcard .em{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;margin-bottom:10px;box-shadow:0 10px 24px -8px var(--accent)}
.tcard .em svg{width:22px;height:22px;color:#fff}
.tcard h3{margin:0 0 6px;font-size:18px;letter-spacing:-.01em}
.tcard p{margin:0;color:var(--muted);font-size:14px;line-height:1.55}
.tcard p kbd{font:600 11px Inter;border:1px solid var(--edge);border-radius:6px;padding:1px 6px;color:var(--text);background:var(--glass2)}
.tfoot{display:flex;align-items:center;gap:8px;margin-top:16px}
.dots{display:flex;gap:5px;flex:1}
.dots i{width:6px;height:6px;border-radius:9px;background:var(--glass3);transition:width .4s var(--ease),background .3s}
.dots i.on{width:20px;background:var(--accent)}
.tfoot button{padding:8px 13px;font-size:13px}
.tskip{border:0;background:none;color:var(--muted);padding:8px 6px}

/* splash */
#splash{position:fixed;inset:0;z-index:3000;background:radial-gradient(circle at 50% 38%,#122033,#05070b 70%);display:grid;place-items:center;transition:opacity .8s,visibility .8s;cursor:pointer;color:#f2f5fa}
#splash.out{opacity:0;visibility:hidden}
.sp-in{text-align:center;padding:20px}
.sp-in svg{width:min(300px,70vw);height:auto;margin:0 auto 14px;overflow:visible}
.sp-in path{fill:none;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:420;stroke-dashoffset:420;animation:draw 1.6s var(--ease) forwards;animation-delay:calc(var(--i)*.18s);filter:drop-shadow(0 0 8px var(--c))}
.sp-in circle{fill:#fff;opacity:0;animation:fadeIn .5s ease forwards;animation-delay:calc(1s + var(--i)*.12s)}
.sp-in h2{font-family:"Space Grotesk";font-size:clamp(30px,6vw,46px);margin:0;letter-spacing:-.03em;background:linear-gradient(90deg,#fff,#7fd0ff 60%,#a58bff);-webkit-background-clip:text;background-clip:text;color:transparent;animation:fadeUp .9s var(--ease) .7s both}
.sp-in p{margin:6px 0 20px;color:#8d97a9;animation:fadeUp .9s var(--ease) .95s both}
.sp-load{width:160px;height:3px;border-radius:9px;background:rgba(255,255,255,.1);margin:0 auto;overflow:hidden}
.sp-load i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#19a7ff,#7c5cff);transform-origin:left;animation:grow 1.8s var(--ease) both}

.pre .leaflet-overlay-pane{opacity:0}
.pre .stop{animation:none!important;transform:scale(0)}
#fold svg{transition:transform .45s var(--ease)}
.panel.min #fold svg{transform:rotate(180deg)}
.chip{box-shadow:inset 0 0 0 1px rgba(255,255,255,.2),0 2px 8px -2px var(--c)}
.fav .main.glass{background:var(--glass2);box-shadow:none;border-radius:12px;padding:9px 12px;cursor:pointer;color:inherit}
.fav .main.glass:hover{background:var(--glass3)}
.rc.glass{background:var(--glass2);box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}

/* keyframes */
@keyframes panelIn{from{opacity:0;transform:translateX(-30px) scale(.97)}to{opacity:1;transform:none}}
@keyframes sheetIn{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
@keyframes fadeDown{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fadeIn{to{opacity:1}}
@keyframes aurora{from{transform:translate(-4%,-3%) rotate(0)}to{transform:translate(5%,4%) rotate(18deg)}}
@keyframes spin{to{--ang:360deg}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes paneIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes slideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(-4px)}to{opacity:1;transform:none}}
@keyframes popup{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes popIn{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes drop{from{opacity:0;transform:translateY(-40px) scale(.6)}to{opacity:1;transform:none}}
@keyframes beat{50%{transform:scale(1.25)}}
@keyframes ring{from{transform:scale(.3);opacity:1}to{transform:scale(1.6);opacity:0}}
@keyframes starp{40%{transform:scale(1.5) rotate(20deg)}}
@keyframes roll{to{transform:rotate(360deg)}}
@keyframes toastIn{from{opacity:0;transform:translateY(20px) scale(.9)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px) scale(.95)}}
@keyframes spotp{50%{box-shadow:0 0 0 9999px rgba(3,6,12,.74),0 0 0 2px var(--accent),0 0 46px 12px color-mix(in srgb,var(--accent) 50%,transparent)}}

/* responsive */
@media(max-width:760px){
  .panel{left:0;right:0;top:auto;bottom:0;width:100%;max-height:70dvh;border-radius:26px 26px 0 0;padding-bottom:env(safe-area-inset-bottom);animation:sheetIn .9s var(--ease) .2s both}
  .grab{display:block}
  .note,.coords,.leaflet-control-zoom{display:none}
  .tr{top:max(12px,env(safe-area-inset-top))}
  .corner{bottom:auto;top:calc(max(12px,env(safe-area-inset-top)) + 62px);left:auto;right:max(12px,env(safe-area-inset-right));align-items:flex-end}
  .legend{transform-origin:top right}
  .toasts{bottom:auto;top:calc(max(12px,env(safe-area-inset-top)) + 8px)}
  .fpill{top:calc(max(12px,env(safe-area-inset-top)) + 58px)}
  .tab{font-size:11px}
}
@media(max-height:620px) and (min-width:761px){.tab span{display:none}.brand small{display:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}

document.documentElement.style.setProperty('--dim', S.dim / 100);

/* ============================================================
   MAIN (carte)
   ============================================================ */
(async () => {
let world = MAP.world, zoom = MAP.zoom, spawn = { x: 0, z: 0 };
try {
  if (!world) { const g = await getJSON(MAP.url + 'tiles/settings.json'); world = g.worlds.slice().sort((a, b) => a.order - b.order)[0].name; }
  const w = await getJSON(MAP.url + 'tiles/' + world + '/settings.json');
  zoom = w.zoom; spawn = w.spawn;
} catch (e) {
  if (!world || !zoom) { banner(t('bn_set')); hideSplash(true); applyLang(); return; }
}
if (zoom.zoom) { spawn = zoom.spawn || spawn; zoom = zoom.zoom; }
const scale = 1 / Math.pow(2, zoom.max);
const NS = 8;
const OW = (x, z) => L.latLng(-z * scale, x * scale);
const P = n => OW(n[0] * NS, n[1] * NS);
const unP = ll => [ll.lng / scale / NS, -ll.lat / scale / NS];
const map = L.map('map', {
  crs: L.CRS.Simple, minZoom: 0, maxZoom: zoom.max + zoom.extra, zoomSnap: 0.25,
  zoomControl: false, attributionControl: false, center: OW(spawn.x, spawn.z), zoom: zoom.def
});
L.control.zoom({ position: 'bottomright' }).addTo(map);
const tiles = L.tileLayer(MAP.url + 'tiles/' + world + '/{z}/{x}_{y}.png', {
  tileSize: 512, minNativeZoom: 0, maxNativeZoom: zoom.max, minZoom: 0, maxZoom: zoom.max + zoom.extra, noWrap: true, errorTileUrl: BLANK
}).addTo(map);
let okTiles = 0, badTiles = 0;
tiles.on('tileload', () => okTiles++).on('tileerror', () => badTiles++).on('load', () => {
  if (!okTiles && badTiles) banner(t('bn_tiles')); else $('banner').hidden = true;
});
map.on('mousemove', e => {
  const x = e.latlng.lng / scale, z = -e.latlng.lat / scale;
  $('coords').textContent = 'Overworld ' + Math.round(x) + ', ' + Math.round(z) + '  ·  Nether ' + Math.round(x / NS) + ', ' + Math.round(z / NS);
});
const fitPad = () => innerWidth > 760
  ? { paddingTopLeft: [Math.min(430, innerWidth * .4), 70], paddingBottomRight: [30, 40] }
  : { paddingTopLeft: [20, 70], paddingBottomRight: [20, $('panel').offsetHeight + 20] };

/* ---- lines ---- */
const kNow = () => Math.max(0.4, Math.min(1.5, 16 * Math.pow(2, map.getZoom() - zoom.max)));
const lineW = () => 5 * kNow();
const cornerR = () => 6 * kNow() / (NS * Math.pow(2, map.getZoom() - zoom.max));
function smooth(pts, r) {
  const p = pts.filter((v, i) => !i || Math.hypot(v[0] - pts[i - 1][0], v[1] - pts[i - 1][1]) > 1e-6);
  if (p.length < 3 || r <= 0) return p;
  const out = [p[0]];
  for (let i = 1; i < p.length - 1; i++) {
    const a = p[i - 1], b = p[i], c = p[i + 1];
    const d1 = Math.hypot(a[0] - b[0], a[1] - b[1]), d2 = Math.hypot(c[0] - b[0], c[1] - b[1]);
    if (Math.abs(((b[0] - a[0]) * (c[1] - b[1]) - (b[1] - a[1]) * (c[0] - b[0])) / (d1 * d2)) < 1e-3) { out.push(b); continue; }
    const tt = Math.min(r, d1 / 2, d2 / 2);
    const e = [b[0] + (a[0] - b[0]) * tt / d1, b[1] + (a[1] - b[1]) * tt / d1], x = [b[0] + (c[0] - b[0]) * tt / d2, b[1] + (c[1] - b[1]) * tt / d2];
    out.push(e);
    for (let n = 1; n < 8; n++) { const u = n / 8, v = 1 - u; out.push([v * v * e[0] + 2 * u * v * b[0] + u * u * x[0], v * v * e[1] + 2 * u * v * b[1] + u * u * x[1]]); }
    out.push(x);
  }
  out.push(p[p.length - 1]);
  return out;
}
function joinChains(geoms) {
  let cs = geoms.map(g => g.slice());
  const key = p => p[0].toFixed(2) + ',' + p[1].toFixed(2);
  for (;;) {
    const ends = {};
    cs.forEach((c, i) => [[0, c[0]], [1, c[c.length - 1]]].forEach(([side, p]) => (ends[key(p)] = ends[key(p)] || []).push([i, side])));
    const hit = Object.values(ends).find(v => v.length === 2 && v[0][0] !== v[1][0]);
    if (!hit) return cs;
    const [[i, si], [j, sj]] = hit;
    const a = si ? cs[i] : cs[i].slice().reverse(), b = sj ? cs[j].slice().reverse() : cs[j];
    cs = cs.filter((_, n) => n !== i && n !== j); cs.push(a.concat(b.slice(1)));
  }
}
const routeSegs = [];
LINES.forEach(l => {
  const g = l.geoms.map(p => p.map(P));
  l.chains = joinChains(l.geoms);
  l.core = L.polyline(l.chains.map(c => smooth(c, cornerR()).map(P)), { color: l.color, weight: 5, opacity: 1, lineCap: 'square', lineJoin: 'round', smoothFactor: 0, interactive: false }).addTo(map);
  l.bounds = L.latLngBounds(g.flat());
});

/* ---- symbols ---- */
ICONS.forEach(i => {
  L.marker(P([i[1], i[2]]), { interactive: false, keyboard: false, icon: L.divIcon({
    className: 'ico', iconSize: [0, 0],
    html: `<img alt="" src="${i[0] === 'c' ? IMG.cross : IMG.merge}" style="--w:${i[4]};--h:${i[5]};transform:translate(-50%,-50%) rotate(${i[3]}deg)">`
  }) }).addTo(map);
});
$('kx').src = IMG.cross; $('km').src = IMG.merge;
const toggleKey = on => { const o = on == null ? !$('legend').classList.contains('on') : on; $('legend').classList.toggle('on', o); $('keyb').setAttribute('aria-expanded', o); };
$('keyb').onclick = () => toggleKey();

/* ---- popups ---- */
const popupHTML = s => {
  const st = STOPS[s];
  return `<div class="ph2"><b class="pt">${esc(st.n)}</b><button class="star${isFav(s) ? ' on' : ''}" data-act="fav" data-s="${esc(s)}" aria-label="★">${svg(ICO.star)}</button></div>` +
    `<div>${sortedLines(s).map(chip).join('')}</div>` +
    `<div class="co">${t('nether')}${st.a ? ' (' + t('approx') + ')' : ''}: <span>${st.c[0]}, ${st.c[1]}</span><button data-act="copy" data-s="${esc(s)}">${t('copy')}</button></div>` +
    (st.g ? `<div class="gt"><i></i>${t('town')}</div>` : '') +
    `<div class="pb"><button class="a" data-act="from" data-s="${esc(s)}">${t('pop_from')}</button><button class="b" data-act="to" data-s="${esc(s)}">${t('pop_to')}</button></div>`;
};
function setStop(which, s) { $(which === 'A' ? 'inA' : 'inB').value = STOPS[s].n; }
function popAct(b) {
  const s = b.dataset.s, a = b.dataset.act;
  if (a === 'fav') {
    toggleFav(s); b.classList.toggle('on', isFav(s)); toast(isFav(s) ? t('fav_add') : t('fav_del'));
  } else if (a === 'copy') {
    copyText(STOPS[s].c[0] + ' ' + STOPS[s].c[1]).then(() => toast(t('copied')));
  } else if (a === 'from' || a === 'to') {
    tab('route'); setStop(a === 'from' ? 'A' : 'B', s); map.closePopup();
    if ($('inA').value && $('inB').value) go();

}
function wirePopup(popup) {
  const el = popup.getElement(); if (!el) return;
  el.querySelectorAll('[data-act]').forEach(b => b.onclick = ev => { ev.stopPropagation(); popAct(b); });
  el.querySelectorAll('[data-line]').forEach(c => c.onclick = ev => { ev.stopPropagation(); isolate(c.dataset.line); });
}
map.on('popupopen', e => wirePopup(e.popup));

/* ---- stops ---- */
ids.forEach(s => {
  const st = STOPS[s], h = hub(s);
  st.ll = P(st.p);
  st.marker = L.circleMarker(st.ll, { radius: 7, className: 'stop', color: h ? '#231f20' : '#fff', weight: 1.5, fillColor: h ? '#fff' : '#231f20', fillOpacity: 1, opacity: 1 })
    .bindTooltip(esc(st.n), { permanent: true, direction: 'right', offset: [12, 0], className: 'lbl' })
    .bindPopup(() => popupHTML(s), { autoPanPadding: [40, 40] })
    .addTo(map);
  const el = st.marker.getElement(); if (el) el.style.setProperty('--d', (Math.random() * 1.1).toFixed(2) + 's');
  const tip = () => st.marker.getTooltip() && st.marker.getTooltip().getElement();
  st.marker.on('mouseover', () => { const e = tip(); e && e.classList.add('peek'); }).on('mouseout', () => { const e = tip(); e && e.classList.remove('peek'); });
  if (st.g) st.dot = L.circleMarker(st.ll, { radius: 2.5, stroke: false, fillColor: '#00ff00', fillOpacity: 1, interactive: false }).addTo(map);
});

const labelZoom = Math.max(0, zoom.max - 1), iconZoom = Math.max(0, zoom.max - 4);
function syncZoom() {
  const z = map.getZoom(), m = $('map'), k = kNow();
  m.classList.toggle('labels', z >= labelZoom); m.classList.toggle('icons', z >= iconZoom);
  m.style.setProperty('--k', k);
  LINES.forEach(l => l.core.setStyle({ weight: 5 * k }));
  const cr = cornerR();
  LINES.forEach(l => l.core.setLatLngs(l.chains.map(c => smooth(c, cr).map(P))));
  routeSegs.forEach(g => { const q = smooth(g.g, cr).map(P); g.white.setLatLngs(q).setStyle({ weight: lineW() + 8 }); g.color.setLatLngs(q).setStyle({ weight: lineW() + 3 }); });
  ids.forEach(s => { const st = STOPS[s]; st.marker.setRadius(7 * k); st.marker.setStyle({ weight: Math.max(1, k) }); if (st.dot) st.dot.setRadius(2.5 * k); });
}
map.on('zoomend', syncZoom);
if (MAP.start) map.setView(OW(MAP.start.x, MAP.start.z), MAP.start.zoom == null ? zoom.def : MAP.start.zoom);
else map.fitBounds(L.latLngBounds(ids.map(s => STOPS[s].ll)).pad(0.1), { maxZoom: zoom.max });
syncZoom();

function pulseAt(ll) {
  const m = L.marker(ll, { interactive: false, keyboard: false, icon: L.divIcon({ className: '', iconSize: [0, 0], html: '<div class="pulse"></div>' }) }).addTo(map);
  setTimeout(() => map.removeLayer(m), 4800);
}

/* ---- dim / isolate ---- */
let focusLine = null, routeLayer = null;
function applyDim() {
  const ex = focusLine ? [focusLine] : (routeLayer ? [] : null);
  LINES.forEach(l => {
    l.core.setStyle({ opacity: ex && !ex.includes(l.id) ? 0.13 : 1 });
    const el = l.core.getElement(); if (el) el.style.filter = focusLine === l.id ? `drop-shadow(0 0 7px ${l.color})` : '';
  });
  $('fpill').classList.toggle('on', !!focusLine);
  if (focusLine) $('fptxt').innerHTML = `${esc(t('fp'))} ${chip(focusLine)}`;
  document.querySelectorAll('.lc').forEach(c => c.classList.toggle('on', c.dataset.id === focusLine));
  const f = $('fpill').querySelector('[data-line]'); if (f) f.onclick = null;
}
function flyLine(l) { map.flyToBounds(l.bounds.pad(0.2), Object.assign({ duration: 0.9 }, fitPad())); }
function isolate(id) {
  if (!id || focusLine === id) focusLine = null; else { focusLine = id; flyLine(LBY[id]); }
  applyDim();
}
$('fpx').onclick = () => isolate(null);

/* ---- search ---- */
const res = $('res');
const COORD = /^\s*(-?\d+(?:\.\d+)?)[\s,;]+(-?\d+(?:\.\d+)?)\s*$/;
function nearest(nx, nz) {
  let best = null, bd = Infinity;
  ids.forEach(s => { const d = Math.hypot(STOPS[s].p[0] - nx, STOPS[s].p[1] - nz); if (d < bd) { bd = d; best = s; } });
  return { s: best, d: bd };
}
function flyStop(s) { map.flyTo(STOPS[s].ll, Math.min(zoom.max, Math.max(map.getZoom(), labelZoom + 1)), { duration: 0.9 }); setTimeout(() => STOPS[s].marker.openPopup(), 700); pulseAt(STOPS[s].ll); }
function closeSearch() { res.classList.remove('show'); }
function search() {
  const raw = $('q').value, q = norm(raw).trim(); res.innerHTML = '';
  if (!q) { closeSearch(); return; }
  const hits = [];
  const m = raw.match(COORD);
  if (m) { const x = +m[1], z = +m[2], n = nearest(x, z); hits.push({ label: `${t('goto')} ${x}, ${z}`, sub: STOPS[n.s].n, kind: 'kind_pos', go: () => { const ll = P([x, z]); map.flyTo(ll, Math.min(zoom.max, Math.max(map.getZoom(), labelZoom)), { duration: 1 }); pulseAt(ll); } }); }
  LINES.filter(l => norm(LN(l.id)).includes(q) || norm(l.name).includes(q) || norm(l.id) === q).forEach(l => hits.push({ label: LN(l.id), kind: 'kind_line', go: () => { focusLine = null; isolate(l.id); }, c: l.color }));
  ids.filter(s => norm(STOPS[s].n).includes(q)).sort((a, b) => (norm(STOPS[a].n).startsWith(q) ? 0 : 1) - (norm(STOPS[b].n).startsWith(q) ? 0 : 1)).forEach(s => hits.push({ label: STOPS[s].n, kind: 'kind_stop', go: () => flyStop(s), s }));
  const list = hits.slice(0, 8);
  if (!list.length) res.innerHTML = `<div class="msg">${t('no_result')}</div>`;
  list.forEach((h, i) => {
    const d = document.createElement('div'); d.className = 'it'; d.tabIndex = 0; d.setAttribute('role', 'option'); d.style.setProperty('--i', i);
    d.innerHTML = (h.c ? `<i class="chip" style="--c:${h.c}">&nbsp;&nbsp;</i>` : h.s ? '' : svg(ICO.pin).replace('<svg', '<svg width="16" height="16"')) + `<span>${esc(h.label)}${h.sub ? ' <small style="margin:0 0 0 6px;text-transform:none">· ' + esc(h.sub) + '</small>' : ''}</span>` + (h.s ? `<span class="lds">${dots(h.s)}</span>` : `<small>${t(h.kind)}</small>`);
    const pick = () => { closeSearch(); if (innerWidth <= 760) $('panel').classList.add('min'); h.go(); };
    d.onclick = pick; d.onkeydown = e => { if (e.key === 'Enter') pick(); };
    res.appendChild(d);
  });
  res.classList.add('show');
}
$('q').addEventListener('input', search);
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') { const f = res.querySelector('.it'); if (f) f.click(); } });
$('qx').onclick = () => { $('q').value = ''; closeSearch(); $('q').focus(); };

/* ---- favorites / recents ---- */
function toggleFav(s) { const i = FAV.s.indexOf(s); if (i < 0) FAV.s.unshift(s); else FAV.s.splice(i, 1); saveF(); buildFavs(); }
function toggleFavR(a, b) { const k = a + '>' + b, i = FAV.r.indexOf(k); if (i < 0) FAV.r.unshift(k); else FAV.r.splice(i, 1); saveF(); buildFavs(); return i < 0; }
function rememberRecent(a, b) { REC = REC.filter(x => !(x[0] === a && x[1] === b)); REC.unshift([a, b]); REC = REC.slice(0, 5); store.set('rec', REC); }
const rcRow = (a, b, i, del, cls) => `<button class="rc glass" data-a="${esc(a)}" data-b="${esc(b)}" style="--i:${i}">${svg(ICO.route)}<span>${esc(STOPS[a].n)} → ${esc(STOPS[b].n)}</span><span class="del" data-del="${del}" role="button" aria-label="×">✕</span></button>`;
function buildRecent() {
  const el = $('recent'); const list = REC.filter(r => STOPS[r[0]] && STOPS[r[1]]);
  if (lastR || !list.length) { el.innerHTML = ''; return; }
  el.innerHTML = `<h4>${t('recent')}</h4>` + list.map((r, i) => rcRow(r[0], r[1], i, i)).join('');
  el.querySelectorAll('.rc').forEach(b => b.onclick = ev => {
    const d = ev.target.closest('[data-del]');
    if (d) { REC.splice(+d.dataset.del, 1); store.set('rec', REC); buildRecent(); return; }
    goIds(b.dataset.a, b.dataset.b);
  });
}
buildFavs = function () {
  const el = $('p-favs');
  const st = FAV.s.filter(s => STOPS[s]), rt = FAV.r.map(k => k.split('>')).filter(r => STOPS[r[0]] && STOPS[r[1]]);
  if (!st.length && !rt.length) { el.innerHTML = `<div class="empty">${svg(ICO.star)}${t('favs_empty')}</div>`; return; }
  el.innerHTML = (st.length ? `<h4 style="margin-top:2px">${t('favs_stops')}</h4>` + st.map((s, i) => `<div class="fav" style="animation:slideUp .4s var(--ease) both;animation-delay:${i * .04}s"><button class="main glass" data-go="${esc(s)}"><span class="n">${esc(STOPS[s].n)}</span><span class="lds">${dots(s)}</span></button><button class="ib" data-from="${esc(s)}" title="${t('pop_from')}">A</button><button class="ib" data-to="${esc(s)}" title="${t('pop_to')}">B</button><button class="ib" data-rm="${esc(s)}" aria-label="×">${svg(ICO.x)}</button></div>`).join('') : '') +
    (rt.length ? `<h4>${t('favs_routes')}</h4>` + rt.map((r, i) => rcRow(r[0], r[1], i, i)).join('') : '');
  el.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { flyStop(b.dataset.go); if (innerWidth <= 760) $('panel').classList.add('min'); });
  el.querySelectorAll('[data-from]').forEach(b => b.onclick = () => { setStop('A', b.dataset.from); tab('route'); if ($('inB').value) go(); });
  el.querySelectorAll('[data-to]').forEach(b => b.onclick = () => { setStop('B', b.dataset.to); tab('route'); if ($('inA').value) go(); });
  el.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { toggleFav(b.dataset.rm); });
  el.querySelectorAll('.rc').forEach(b => b.onclick = ev => {
    const d = ev.target.closest('[data-del]');
    if (d) { FAV.r.splice(+d.dataset.del, 1); saveF(); buildFavs(); if (lastAB) renderResult(lastR, lastAB[0], lastAB[1], true); return; }
    goIds(b.dataset.a, b.dataset.b);
  });
};

/* ---- autocomplete ---- */
function find(v) {
  const q = norm(v).trim(); if (!q) return null;
  return ids.find(s => norm(STOPS[s].n) === q) || ids.find(s => norm(STOPS[s].n).includes(q)) || null;
}
function attachAC(inp, box) {
  let items = [], idx = -1;
  const rank = (q, s) => { const n = norm(STOPS[s].n); return n.startsWith(q) ? 0 : n.split(/[\s\/\-]/).some(w => w.startsWith(q)) ? 1 : 2; };
  function render() {
    const q = norm(inp.value).trim();
    items = q ? ids.filter(s => norm(STOPS[s].n).includes(q)).sort((a, b) => rank(q, a) - rank(q, b) || STOPS[a].n.localeCompare(STOPS[b].n)).slice(0, 7)
              : FAV.s.filter(s => STOPS[s]).slice(0, 6);
    idx = -1;
    if (!items.length) { box.classList.remove('on'); return; }
    box.innerHTML = items.map((s, i) => `<div class="aci" data-i="${i}" role="option">${esc(STOPS[s].n)}<span class="lds">${dots(s)}</span></div>`).join('');
    box.classList.add('on');
  }
  const pick = i => { inp.value = STOPS[items[i]].n; box.classList.remove('on'); if (find($('inA').value) && find($('inB').value)) go(); else (inp.id === 'inA' ? $('inB') : $('inA')).focus(); };
  inp.addEventListener('input', render); inp.addEventListener('focus', render);
  inp.addEventListener('blur', () => setTimeout(() => box.classList.remove('on'), 160));
  box.addEventListener('pointerdown', e => { const el = e.target.closest('.aci'); if (el) { e.preventDefault(); pick(+el.dataset.i); } });
  inp.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      if (!box.classList.contains('on')) render(); if (!items.length) return; e.preventDefault();
      idx = (idx + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
      box.querySelectorAll('.aci').forEach((el, i) => el.classList.toggle('act', i === idx));
    } else if (e.key === 'Enter') {
      if (idx >= 0 && box.classList.contains('on')) { e.preventDefault(); pick(idx); return; }
      box.classList.remove('on'); go();
    } else if (e.key === 'Escape') box.classList.remove('on');
  });
}
attachAC($('inA'), $('acA')); attachAC($('inB'), $('acB'));

/* ---- journey ---- */
let lastR = null, lastAB = null, legPts = [], rAnim = 0, trainM = null;
function clearRoute(keepOut) {
  cancelAnimationFrame(rAnim);
  routeSegs.length = 0;
  if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
  trainM = null; lastR = null; lastAB = null;
  if (!keepOut) $('out').innerHTML = '';
  applyDim(); buildRecent();
}
function goIds(a, b) { tab('route'); setStop('A', a); setStop('B', b); go(); }
function go(quiet) {
  clearRoute();
  const a = find($('inA').value), b = find($('inB').value), out = $('out');
  if (!a || !b) { out.innerHTML = `<div class="msg err">${t('err_choose')}</div>`; return; }
  if (a === b) { out.innerHTML = `<div class="msg err">${t('err_same')}</div>`; return; }
  const r = computeRoute(a, b);
  if (!r || !r.legs.length) { out.innerHTML = `<div class="msg err">${t('err_none')}</div>`; return; }
  lastR = r; lastAB = [a, b]; rememberRecent(a, b);
  drawRoute(r, a, b, quiet);
  renderResult(r, a, b, quiet);
  try { history.replaceState(null, '', '#r=' + a + ',' + b); } catch (e) {}
  if (innerWidth <= 760 && !quiet) { setTimeout(() => $('panel').classList.contains('min') || $('panel').scrollTo?.(0, 0), 0); }
}
function drawRoute(r, a, b, quiet) {
  routeLayer = L.layerGroup().addTo(map); applyDim();
  const cr = cornerR();
  const legs = r.legs.map(l => ({ line: l.line, g: l.edges.reduce((acc, e) => {
    const f = e.g[0], z = acc[acc.length - 1];
    return acc.concat(z && z[0] === f[0] && z[1] === f[1] ? e.g.slice(1) : e.g);
  }, []) }));
  const mk = (l, color, extra) => L.polyline(smooth(l.g, cr).map(P), { color, weight: lineW() + extra, lineCap: 'square', lineJoin: 'round', interactive: false }).addTo(routeLayer);
  const whites = legs.map(l => mk(l, '#fff', 8));
  legs.forEach((l, i) => routeSegs.push({ g: l.g, white: whites[i], color: mk(l, LBY[l.line].color, 3) }));
  legPts = legs.map(l => smooth(l.g, cr).map(P));
  const all = [].concat(...legPts);
  const pin = (ll, txt, col, delay) => L.marker(ll, { interactive: false, keyboard: false, zIndexOffset: 900, icon: L.divIcon({ className: '', iconSize: [0, 0], html: `<div class="pinm" style="--pc:${col}"><div style="animation-delay:${delay}s"><i></i><b>${txt}</b></div></div>` }) }).addTo(routeLayer);
  pin(all[0], 'A', 'var(--accent)', 0.1); pin(all[all.length - 1], 'B', '#18b57a', quiet || reduce ? 0.1 : 4.6);
  if (!quiet) { map.flyToBounds(L.latLngBounds(all).pad(0.25), Object.assign({ duration: 0.9, maxZoom: zoom.max }, fitPad())); animateRoute(); }
}
function animateRoute() {
  cancelAnimationFrame(rAnim);
  if (trainM) { trainM.remove(); trainM = null; }
  if (!routeSegs.length || !routeLayer) return;
  const els = routeSegs.map(sg => [sg.white.getElement(), sg.color.getElement()]);
  if (reduce) { els.forEach(p => p.forEach(el => { if (el) { el.style.strokeDasharray = ''; el.style.opacity = ''; } })); return; }
  const all = [].concat(...legPts), cum = [0];
  for (let i = 1; i < all.length; i++) cum[i] = cum[i - 1] + Math.hypot(all[i].lat - all[i - 1].lat, all[i].lng - all[i - 1].lng);
  const total = cum[cum.length - 1] || 1, bounds = []; let acc = 0;
  legPts.forEach(pts => { let d = 0; for (let i = 1; i < pts.length; i++) d += Math.hypot(pts[i].lat - pts[i - 1].lat, pts[i].lng - pts[i - 1].lng); bounds.push([acc / total, (acc + d) / total]); acc += d; });
  const lens = els.map(p => p.map(el => { try { return el ? el.getTotalLength() : 0; } catch (e) { return 0; } }));
  const train = trainM = L.marker(all[0], { interactive: false, keyboard: false, zIndexOffset: 1000, icon: L.divIcon({ className: '', iconSize: [0, 0], html: '<div class="train"></div>' }) }).addTo(routeLayer);
  const DUR = 3800 + routeSegs.length * 350, t0 = performance.now() + 800;
  const step = now => {
    const p = Math.max(0, Math.min(1, (now - t0) / DUR)), e = p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2, d = e * total;
    let i = 1; while (i < cum.length - 1 && cum[i] < d) i++;
    const seg = cum[i] - cum[i - 1] || 1, f = Math.max(0, Math.min(1, (d - cum[i - 1]) / seg));
    train.setLatLng([all[i - 1].lat + (all[i].lat - all[i - 1].lat) * f, all[i - 1].lng + (all[i].lng - all[i - 1].lng) * f]);
    els.forEach((pair, k) => {
      const [a0, b0] = bounds[k], fr = Math.max(0, Math.min(1, (e - a0) / ((b0 - a0) || 1)));
      pair.forEach((el, m) => { if (!el) return; const T = lens[k][m]; el.style.strokeDasharray = `${T * fr} ${T + 20}`; el.style.opacity = fr > 0 ? '' : '0'; });
    });
    if (p < 1) rAnim = requestAnimationFrame(step);
    else {
      els.forEach(pair => pair.forEach(el => { if (el) { el.style.strokeDasharray = ''; el.style.opacity = ''; } }));
      const te = train.getElement(); if (te && te.firstChild) te.firstChild.classList.add('out');
      setTimeout(() => { train.remove(); if (trainM === train) trainM = null; }, 500);
      pulseAt(all[all.length - 1]);
    }
  };
  rAnim = requestAnimationFrame(step);
}
const fmtT = s => fmt(s);
function renderResult(r, a, b, quiet) {
  const out = $('out'), tm = realTime(r), xf = r.legs.length - 1;
  const bar = r.legs.map((l, i) => `<i style="--c:${LBY[l.line].color};--w:${Math.max(l.sec, 1)};--i:${i}" title="${esc(LN(l.line))}"></i>`).join('');
  let rows = '';
  r.legs.forEach((l, i) => {
    if (i) rows += `<div class="xfer" style="--i:${i}">${svg(ICO.swap).replace('<svg', '<svg width="13" height="13"')}<span>${t('transfer')} · ${esc(nodeName(l.stops[0]))} · ${XN[l.stops[0]] ? S.crossing : S.transfer} ${t('u_s')}</span></div>`;
    const n = l.stops.slice(1).filter(s => STOPS[s]).length;
    rows += `<button class="leg" data-i="${i}" style="--i:${i}">${chip(l.line)}<div><b>${esc(nodeName(l.stops[0]))} → ${esc(nodeName(l.stops[l.stops.length - 1]))}</b><span>${n} ${t(n === 1 ? 'stop1' : 'stopN')} · ${fmtT(l.sec)}</span></div>${svg(ICO.chev).replace('<svg', '<svg class="chev"')}</button>`;
  });
  const fr = isFavR(a, b);
  out.innerHTML = `<div class="rs"><div class="rs-top"><div class="stat main"><b id="rs-t">${quiet ? fmtT(tm) : fmtT(0)}</b><span>${t('sum_time')}</span></div><div class="stat"><b>${xf}</b><span>${t('sum_tr')}</span></div><div class="stat"><b>${Math.round(r.blocks).toLocaleString(S.lang === 'fr' ? 'fr-FR' : 'en-US')}</b><span>${t('sum_bl')}</span></div></div>` +
    `<div class="bar">${bar}</div>${rows}` +
    `<div class="rs-acts"><button class="btn" id="b-share">${svg(ICO.share)}${t('share')}</button><button class="btn" id="b-replay">${svg(ICO.replay)}${t('replay')}</button><button class="btn" id="b-save" style="${fr ? 'color:#ffc933;border-color:#ffc93355' : ''}">${svg(ICO.star)}${t('save')}</button><button class="btn" id="b-clear">${svg(ICO.x)}${t('clear')}</button></div></div>`;
  $('recent').innerHTML = '';
  if (!quiet) countTo($('rs-t'), tm, fmtT);
  out.querySelectorAll('.leg').forEach(b2 => b2.onclick = () => { const i = +b2.dataset.i; if (legPts[i]) map.flyToBounds(L.latLngBounds(legPts[i]).pad(0.3), Object.assign({ duration: 0.8, maxZoom: zoom.max }, fitPad())); });
  out.querySelectorAll('[data-line]').forEach(c => c.onclick = ev => { ev.stopPropagation(); isolate(c.dataset.line); });
  $('b-share').onclick = () => {
    const url = location.href.split('#')[0] + '#r=' + a + ',' + b;
    if (navigator.share && matchMedia('(pointer:coarse)').matches) navigator.share({ title: 'Transit Map', url }).catch(() => {});
    else copyText(url).then(() => toast(t('link_copied')));
  };
  $('b-replay').onclick = () => { const all = [].concat(...legPts); map.flyToBounds(L.latLngBounds(all).pad(0.25), Object.assign({ duration: 0.8, maxZoom: zoom.max }, fitPad())); animateRoute(); };
  $('b-save').onclick = () => { const on = toggleFavR(a, b); $('b-save').style.cssText = on ? 'color:#ffc933;border-color:#ffc93355' : ''; toast(on ? t('route_saved') : t('route_unsaved')); };
  $('b-clear').onclick = () => { $('inA').value = ''; $('inB').value = ''; clearRoute(); try { history.replaceState(null, '', location.href.split('#')[0]); } catch (e) {} };
}
$('go').onclick = () => go();
$('swap').onclick = () => { const x = $('inA').value; $('inA').value = $('inB').value; $('inB').value = x; $('swap').classList.toggle('spin'); if (x && $('inA').value) go(); };
$('dice').onclick = () => {
  let pick = null;
  for (let n = 0; n < 14; n++) {
    const a = ids[Math.floor(Math.random() * ids.length)], b = ids[Math.floor(Math.random() * ids.length)];
    if (a === b) continue;
    const r = route(a, b); if (r && r.legs.length >= 2) { pick = [a, b]; break; }
    if (r && r.legs.length && !pick) pick = [a, b];
  }
  if (pick) goIds(pick[0], pick[1]);
};
$('seg').querySelectorAll('button').forEach(b => b.onclick = () => {
  S.mode = b.dataset.mode; saveS(); syncMode(); if (lastAB) go(true);
});
function syncMode() { $('seg').classList.toggle('r', S.mode === 'fewer'); $('seg').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.mode === S.mode)); }
syncMode();

/* ---- lines pane ---- */
function buildLines() {
  const isNum = l => /^\d+$/.test(l.id);
  const card = (l, i) => `<button class="lc${focusLine === l.id ? ' on' : ''}" data-id="${esc(l.id)}" style="--c:${l.color};--i:${i}">${chip(l.id).replace('<i class="chip"', '<i class="chip w"')}<small>${stopCount[l.id]} ${t(stopCount[l.id] === 1 ? 'stop1' : 'stopN')}</small></button>`;
  $('p-lines').innerHTML = `<p class="hint">${t('lines_hint')}</p><h4>${t('lines_num')}</h4><div class="lgrid">${LINES.filter(isNum).map(card).join('')}</div><h4>${t('lines_let')}</h4><div class="lgrid">${LINES.filter(l => !isNum(l)).map(card).join('')}</div><div class="acts" style="margin-top:14px"><button class="btn go" id="lall">${t('lines_all')}</button></div>`;
  $('p-lines').querySelectorAll('.lc').forEach(c => {
    c.onclick = () => isolate(c.dataset.id);
    c.onmouseenter = () => { if (focusLine || routeLayer) return; LINES.forEach(l => l.core.setStyle({ opacity: l.id === c.dataset.id ? 1 : 0.15 })); };
    c.onmouseleave = () => applyDim();
  });
  $('lall').onclick = () => { focusLine = null; applyDim(); };
}

/* ---- settings pane ---- */
function buildSet() {
  const rng = (id, label, min, max, val, unit) => `<div class="set"><label for="r-${id}">${label}<output id="o-${id}">${val} ${unit}</output></label><input type="range" id="r-${id}" min="${min}" max="${max}" value="${val}" style="--p:${(val - min) / (max - min) * 100}%"></div>`;
  $('p-set').innerHTML = rng('speed', t('set_speed'), 20, 140, S.speed, t('u_bs')) + rng('transfer', t('set_transfer'), 0, 120, S.transfer, t('u_s')) + rng('crossing', t('set_cross'), 0, 90, S.crossing, t('u_s')) + rng('dim', t('set_dim'), 30, 120, S.dim, '%') +
    `<div class="two"><div class="set"><label>${t('set_theme')}</label><div class="seg${S.theme === 'light' ? ' r' : ''}" id="seg-theme"><i></i><button data-v="dark" class="${S.theme === 'dark' ? 'on' : ''}">${t('theme_dark')}</button><button data-v="light" class="${S.theme === 'light' ? 'on' : ''}">${t('theme_light')}</button></div></div>` +
    `<div class="set"><label>${t('set_lang')}</label><div class="seg${S.lang === 'en' ? ' r' : ''}" id="seg-lang"><i></i><button data-v="fr" class="${S.lang === 'fr' ? 'on' : ''}">FR</button><button data-v="en" class="${S.lang === 'en' ? 'on' : ''}">EN</button></div></div></div>` +
    `<h4>${t('about')}</h4><div class="about"><div class="stat"><b data-count="${LINES.length}">0</b><span>${t('st_lines')}</span></div><div class="stat"><b data-count="${ids.length}">0</b><span>${t('st_stops')}</span></div><div class="stat"><b data-count="${ids.filter(hub).length}">0</b><span>${t('st_hubs')}</span></div><div class="stat"><b data-count="${Math.round(netLen / 1000)}" data-k="1">0</b><span>${t('st_len')}</span></div></div>` +
    `<button class="btn link" id="s-tour">${svg(ICO.help)}${t('replay_tour')}</button><button class="btn link" id="s-reset">${svg(ICO.replay)}${t('reset')}</button>`;
  let timer;
  const bind = (id, key, unit, apply) => {
    const r = $('r-' + id); if (!r) return;
    r.oninput = () => {
      S[key] = +r.value; $('o-' + id).textContent = r.value + ' ' + unit; r.style.setProperty('--p', (r.value - r.min) / (r.max - r.min) * 100 + '%');
      Object.assign(TRAVEL, { speed: S.speed, transfer: S.transfer, crossing: S.crossing }); if (apply) apply();
      saveS(); clearTimeout(timer); timer = setTimeout(() => { if (lastAB) go(true); }, 250);
    };
  };
  bind('speed', 'speed', t('u_bs')); bind('transfer', 'transfer', t('u_s')); bind('crossing', 'crossing', t('u_s'));
  bind('dim', 'dim', '%', () => document.documentElement.style.setProperty('--dim', S.dim / 100));
  $('seg-theme').querySelectorAll('button').forEach(b => b.onclick = () => { S.theme = b.dataset.v; saveS(); applyTheme(); $('seg-theme').classList.toggle('r', S.theme === 'light'); $('seg-theme').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); });
  $('seg-lang').querySelectorAll('button').forEach(b => b.onclick = () => { S.lang = b.dataset.v; saveS(); applyLang(); });
  $('s-tour').onclick = () => startTour();
  $('s-reset').onclick = () => {
    Object.assign(S, { speed: DEF.speed, transfer: DEF.transfer, crossing: DEF.crossing, mode: 'fast', dim: DEF.dim });
    Object.assign(TRAVEL, { speed: S.speed, transfer: S.transfer, crossing: S.crossing });
    document.documentElement.style.setProperty('--dim', S.dim / 100); saveS(); syncMode(); buildSet(); if (lastAB) go(true);
  };
  if ($('p-set').classList.contains('on') || true) $('p-set').querySelectorAll('[data-count]').forEach(el => countTo(el, +el.dataset.count, v => Math.round(v) + (el.dataset.k ? 'k' : '')));
}
document.getElementById('t-set').addEventListener('click', () => $('p-set').querySelectorAll('[data-count]').forEach(el => countTo(el, +el.dataset.count, v => Math.round(v) + (el.dataset.k ? 'k' : ''))));

/* ---- right-click / long-press: nearest stop ---- */
map.on('contextmenu', e => {
  const [nx, nz] = unP(e.latlng), n = nearest(nx, nz), st = STOPS[n.s];
  const html = `<div class="ph2"><b class="pt">${t('nearest')}</b></div><div style="margin-top:6px;font-weight:600">${esc(st.n)}</div><div style="margin:4px 0">${sortedLines(n.s).map(chip).join('')}</div>` +
    `<div class="co">${t('dist').replace('{n}', '<span>' + Math.round(n.d).toLocaleString(S.lang === 'fr' ? 'fr-FR' : 'en-US') + '</span>')}</div>` +
    `<div class="pb"><button class="a" data-act="from" data-s="${esc(n.s)}">${t('pop_from')}</button><button class="b" data-act="to" data-s="${esc(n.s)}">${t('pop_to')}</button></div>`;
  L.popup({ autoPanPadding: [40, 40] }).setLatLng(e.latlng).setContent(html).openOn(map);
  pulseAt(e.latlng);
});

/* ---- guided tour ---- */
const TOUR = [
  { k: 1, ic: 'bolt' },
  { k: 2, ic: 'search', sel: '.srch', before: () => tab('route') },
  { k: 3, ic: 'route', sel: '#plan-box', before: () => tab('route') },
  { k: 4, ic: 'dice', sel: '#plan-actions', before: () => tab('route') },
  { k: 5, ic: 'map' },
  { k: 6, ic: 'lines', sel: '#p-lines', before: () => tab('lines') },
  { k: 7, ic: 'star', sel: '#t-favs', before: () => tab('favs') },
  { k: 8, ic: 'set', sel: '#t-set', before: () => tab('set') },
  { k: 9, ic: 'key', sel: '#corner', before: () => { tab('route'); if (innerWidth <= 760) $('panel').classList.add('min'); } },
  { k: 10, ic: 'kbd', sel: '#tools', before: () => { tab('route'); } }
];
let ti = -1;
function startTour() { ti = 0; $('tour').classList.add('on'); $('panel').classList.remove('min'); toggleKey(false); showStep(); }
function endTour() { $('tour').classList.remove('on'); ti = -1; store.set('seen', 1); tab('route'); toggleKey(false); }
function showStep() {
  const s = TOUR[ti];
  if (s.before) s.before();
  $('tcard').innerHTML = `<div class="tb"><div class="em">${svg(ICO[s.ic])}</div><h3>${t('t' + s.k + 't')}</h3><p>${t('t' + s.k + 'd')}</p></div>` +
    `<div class="tfoot"><button class="tskip" id="t-skip">${t('t_skip')}</button><div class="dots">${TOUR.map((_, i) => `<i class="${i === ti ? 'on' : ''}"></i>`).join('')}</div>${ti ? `<button id="t-prev">${t('t_prev')}</button>` : ''}<button class="btn pri" id="t-next">${ti === TOUR.length - 1 ? t('t_done') : t('t_next')}</button></div>`;
  $('t-skip').onclick = endTour; $('t-next').onclick = nextStep; if ($('t-prev')) $('t-prev').onclick = prevStep;
  placeStep(); setTimeout(placeStep, s.before ? 460 : 60);
}
function placeStep() {
  if (ti < 0) return;
  const s = TOUR[ti], el = s.sel && document.querySelector(s.sel), vw = innerWidth, vh = innerHeight, spot = $('tspot'), card = $('tcard');
  let r = null; if (el) { const b = el.getBoundingClientRect(); if (b.width > 2 && b.height > 2) r = b; }
  const pad = 8;
  if (r) { spot.style.left = r.left - pad + 'px'; spot.style.top = r.top - pad + 'px'; spot.style.width = r.width + pad * 2 + 'px'; spot.style.height = r.height + pad * 2 + 'px'; }
  else { spot.style.left = vw / 2 + 'px'; spot.style.top = vh / 2 + 'px'; spot.style.width = '0px'; spot.style.height = '0px'; }
  const cw = card.offsetWidth, ch = card.offsetHeight, cl = (v, lo, hi) => Math.max(lo, Math.min(v, hi)); let x, y;
  if (!r) { x = (vw - cw) / 2; y = (vh - ch) / 2; }
  else if (vw > 760 && r.right + pad + cw + 16 < vw) { x = r.right + pad + 16; y = cl(r.top, 12, vh - ch - 12); }
  else if (r.bottom + pad + ch + 16 < vh) { x = cl(r.left, 12, vw - cw - 12); y = r.bottom + pad + 16; }
  else if (r.top - pad - ch - 16 > 0) { x = cl(r.left, 12, vw - cw - 12); y = r.top - pad - ch - 16; }
  else { x = (vw - cw) / 2; y = (vh - ch) / 2; }
  card.style.left = x + 'px'; card.style.top = y + 'px';
}
const nextStep = () => { if (ti >= TOUR.length - 1) endTour(); else { ti++; showStep(); } };
const prevStep = () => { if (ti > 0) { ti--; showStep(); } };
addEventListener('resize', () => { if (ti >= 0) placeStep(); });
$('helpb').onclick = startTour;

/* ---- keyboard ---- */
addEventListener('keydown', e => {
  if ($('tour').classList.contains('on')) {
    if (e.key === 'ArrowRight' || e.key === 'Enter') { e.preventDefault(); nextStep(); }
    else if (e.key === 'ArrowLeft') prevStep(); else if (e.key === 'Escape') endTour();
    return;
  }
  const tag = (e.target.tagName || '').toLowerCase(), typing = tag === 'input' || tag === 'textarea';
  if (e.key === 'Escape') { if (typing) e.target.blur(); closeSearch(); if (focusLine) isolate(null); toggleKey(false); map.closePopup(); return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  switch (e.key.toLowerCase()) {
    case '/': e.preventDefault(); $('panel').classList.remove('min'); $('q').focus(); break;
    case 'r': e.preventDefault(); tab('route'); $('inA').focus(); break;
    case 'l': tab('lines'); break;
    case 'f': tab('favs'); break;
    case 'k': toggleKey(); break;
    case 't': $('themeb').click(); break;
    case '?': startTour(); break;
  }
});
document.addEventListener('pointerdown', e => { if (!e.target.closest('.srch') && !e.target.closest('#res')) closeSearch(); });

/* ---- share link (#r=a,b) ---- */
function fromHash() {
  const m = location.hash.match(/^#r=([^,]+),(.+)$/); if (!m) return false;
  const a = decodeURIComponent(m[1]), b = decodeURIComponent(m[2]);
  if (STOPS[a] && STOPS[b]) { goIds(a, b); return true; }
  return false;
}
addEventListener('hashchange', () => { if (lastAB && location.hash === '#r=' + lastAB.join(',')) return; fromHash(); });

/* ---- init ---- */
langHooks.push(() => { buildLines(); buildFavs(); buildSet(); buildRecent(); applyDim(); if (lastR && lastAB) renderResult(lastR, lastAB[0], lastAB[1], true); });
applyLang();

/* intro: lines draw in, stops pop in */
revealFn = () => {
  const m = $('map');
  const prep = LINES.map(l => { const el = l.core.getElement(); let T = 0; try { T = el ? el.getTotalLength() : 0; } catch (e) {} return [l, el, T]; });
  if (!reduce) prep.forEach(([l, el, T]) => { if (el && T) { el.style.strokeDasharray = T + ' ' + T; el.style.strokeDashoffset = T; } });
  m.getBoundingClientRect();
  m.classList.remove('pre');
  if (!reduce) requestAnimationFrame(() => prep.forEach(([l, el, T], i) => {
    if (!el || !T) return;
    el.style.transition = `stroke-dashoffset 1.9s cubic-bezier(.2,.9,.2,1) ${i * 0.06}s`; el.style.strokeDashoffset = 0;
    setTimeout(() => { el.style.transition = ''; el.style.strokeDasharray = ''; el.style.strokeDashoffset = ''; }, 1900 + i * 60 + 150);
  }));
  setTimeout(() => { if (!fromHash() && !store.get('seen', 0)) startTour(); }, 1500);
};
hideSplash(); reveal();
})();
